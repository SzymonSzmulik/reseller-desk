<title>Reseller Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone = one column + flat bottom bar with a yellow "New" sticker; desktop (≥1000px) = left sidebar + wide two-column content.
   Look: a reseller's stockroom ledger. Paper-white and ink, ruled lines instead of floating cards, price-sticker yellow used only for "new" and highlights, condensed label type, mono for money and SKUs. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --sunk:#ECECE8; --raised:#FFFFFF; --line:#DEDED8; --rule:#161616;
  --fg:#161616; --muted:#66665F; --faint:#93938B;
  --accent:#161616; --accent-ink:#FFFFFF; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#FFF4C2;
  --listed:#2B5CB8; --listed-bg:#E5ECF8; --sold:#1E7440; --sold-bg:#E1F1E6; --ret:#BF3A2B; --ret-bg:#F8E4E1;
  --warn:#7A5300; --warn-bg:#FFF1C9;
  --chart:#161616; --chart-neg:#BF3A2B; --grid:#E6E6E0;
  --pv-bg:#FFFFFF; --pv-fg:#111111;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px; --r-sm:6px;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1A1A19; --sunk:#242422; --raised:#1F1F1E; --line:#2E2E2B; --rule:#EDEDE8;
  --fg:#EDEDE8; --muted:#A0A098; --faint:#74746D;
  --accent:#EDEDE8; --accent-ink:#111111; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#3A3315;
  --listed:#8FB1F2; --listed-bg:#1C2638; --sold:#7DD39C; --sold-bg:#17291E; --ret:#F2958A; --ret-bg:#351C19;
  --warn:#F2CB6B; --warn-bg:#352C12;
  --chart:#EDEDE8; --chart-neg:#F2958A; --grid:#2A2A27;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1A1A19; --sunk:#242422; --raised:#1F1F1E; --line:#2E2E2B; --rule:#EDEDE8;
  --fg:#EDEDE8; --muted:#A0A098; --faint:#74746D;
  --accent:#EDEDE8; --accent-ink:#111111; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#3A3315;
  --listed:#8FB1F2; --listed-bg:#1C2638; --sold:#7DD39C; --sold-bg:#17291E; --ret:#F2958A; --ret-bg:#351C19;
  --warn:#F2CB6B; --warn-bg:#352C12;
  --chart:#EDEDE8; --chart-neg:#F2958A; --grid:#2A2A27;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .7);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--hl);color:var(--hl-ink);font-family:var(--display);font-weight:900;font-size:18px;position:relative;flex:none}
.tag::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--hl-ink)}
.topbtns{display:flex;gap:6px;align-items:center;min-width:0}
.switch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 10px 7px 12px;font-weight:600;font-size:14px;min-height:38px;max-width:44vw;min-width:0}
.switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch svg,.gear svg{width:18px;height:18px;flex:none}
.gear{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);width:38px;height:38px;display:grid;place-items:center;flex:none}
a.gear{text-decoration:none}
@media (max-width:420px){.brand .nm{display:none}}

h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:34px;line-height:1.05;margin:14px 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:700;font-stretch:88%;font-size:19px;margin:28px 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
a{color:var(--fg);text-decoration-thickness:1px;text-underline-offset:3px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px}
label.f small,.lab small{font-weight:400;color:var(--muted);font-size:13.5px}
.lab{font-weight:600;margin-bottom:8px;font-size:14.5px}
input[type=text],input[type=number],input[type=url],input[type=search],textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--fg);outline-offset:-1px;border-color:var(--fg)}
button:focus-visible,.chip:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.money{position:relative}.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-family:var(--mono)}.money input{padding-left:28px;font-family:var(--mono)}
.ck{display:flex;gap:12px;align-items:center;font-weight:500}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--fg)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);border-radius:var(--r);padding:13px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);min-height:50px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{background:var(--ret);border-color:var(--ret);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14.5px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:11px 4px;font-weight:600;font-size:14.5px;min-height:46px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tog{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.tog button{border:0;background:var(--surface);color:var(--muted);padding:5px 10px;font-weight:600;font-size:13px}
.tog button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* status */
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill.Listed{background:var(--listed-bg);color:var(--listed)}.pill.Sold{background:var(--sold-bg);color:var(--sold)}.pill.Returned{background:var(--ret-bg);color:var(--ret)}
.sku{font-family:var(--mono);font-size:12.5px;background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:1px 6px;white-space:nowrap;font-weight:500}
.note{border-radius:var(--r-sm);padding:12px 14px;font-size:15px;border-left:3px solid currentColor}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.ok{background:var(--sold-bg);color:var(--sold)}.note.err{background:var(--ret-bg);color:var(--ret)}.note.info{background:var(--sunk);color:var(--fg)}
.pos{color:var(--sold)}.neg{color:var(--ret)}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--hl);color:var(--hl-ink)}

/* numbers */
.hero{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rule);border-radius:var(--r);padding:18px 18px 10px}
.hero .lbl,.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:50px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}
.hero .sub{color:var(--muted);font-size:14px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.kpi{padding:13px 15px;min-width:0;background:var(--surface)}
.kpi .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .val{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em}
.kpi .hint{font-size:13px;color:var(--muted)}
.check{width:100%;border-collapse:collapse;font-size:15px}
.check td,.check th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.check td:not(:first-child){font-family:var(--mono)}
.check tr:last-child td{border-bottom:0}
.check th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* charts */
.chart{position:relative;overflow:hidden;padding-top:30px;margin-top:-22px}
.chart svg{display:block;width:100%;height:auto;overflow:hidden;max-width:100%}
.chart .tip{position:absolute;top:0;z-index:2;transform:translate(-50%,-112%);max-width:70%;overflow:hidden;text-overflow:ellipsis;background:var(--hl);color:var(--hl-ink);font-family:var(--mono);font-size:12.5px;font-weight:500;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 8px;overflow:hidden}
.ccard .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.ccard .ch b{font-family:var(--display);font-weight:700;font-stretch:88%;font-size:16px}
.ccard .ch span{color:var(--muted);font-size:13px;font-family:var(--mono)}
.cap{font-size:13.5px;color:var(--muted);margin:4px 2px 6px;line-height:1.4}
.chart text.vl{fill:var(--fg);font-size:9.5px;font-weight:500}
.sub2{color:var(--muted);font-size:14px;margin:-4px 2px 8px;line-height:1.4}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14.5px;padding-bottom:6px}
.hbar .tr{grid-column:1 / -1;height:8px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:8px}
.hbar .tr i{display:block;height:100%;background:var(--chart);border-radius:2px}
.hbar .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* lists: ruled ledger rows */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;color:inherit;border-radius:0}
.item:hover{background:var(--sunk)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.item .price{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.picked{background:var(--accent-soft)}
.tick{flex:none;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--faint);display:grid;place-items:center;margin-top:2px;background:var(--surface)}
.item.picked .tick{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;padding:0 2px 6px;border-bottom:2px solid var(--rule)}
.boxhead b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:17px;letter-spacing:.02em}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.listcard .item:last-child{border-bottom:0}

/* listing output */
.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.field .fh b{font-size:14px}.field .fh small{color:var(--muted);font-size:12.5px;display:block;font-weight:400}
.field textarea,.field input{border:0;border-radius:0;background:var(--surface)}
.field table{width:100%;border-collapse:collapse;font-size:14.5px}.field td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:top}.field tr:first-child td{border-top:0}.field td:first-child{color:var(--muted);width:42%}
.pv{background:var(--pv-bg);color:var(--pv-fg);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45;padding:14px 16px;overflow-wrap:anywhere;max-height:520px;overflow:auto}
.pv h1,.pv h2,.pv h3{font-family:Arial,Helvetica,sans-serif;font-size:19px;margin:12px 0 6px;color:var(--pv-fg);font-stretch:100%}
.pv p{margin:0 0 10px}.pv ul{margin:0 0 10px;padding-left:22px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.drop{border:1.5px dashed var(--faint);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop:hover{border-color:var(--fg)}
.drop strong{display:block;font-size:16px}

/* photos */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery button{flex:none;border:1px solid var(--line);padding:0;background:var(--sunk);border-radius:var(--r-sm);overflow:hidden;width:120px;height:120px;scroll-snap-align:start}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .ph{width:120px;height:120px;border-radius:var(--r-sm);flex:none;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.viewer{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.viewer img{max-width:100%;max-height:86vh;border-radius:6px}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#fff;color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:700}

/* nav: flat bar on phones, sidebar on desktop */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs .side-brand{display:none}
nav.tabs button{background:none;border:0;color:var(--faint);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;min-height:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"]::after{content:"";width:18px;height:2px;background:var(--fg);border-radius:2px;margin-top:1px}
nav.tabs button.fab span{width:46px;height:40px;border-radius:7px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;position:relative}
nav.tabs button.fab span::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--hl-ink)}
nav.tabs button.fab svg{width:22px;height:22px}
nav.tabs button.fab em{font-style:normal;color:var(--muted)}
nav.tabs button.fab[aria-current="page"]::after{display:none}
nav.tabs button.pin .pw{display:none}
nav.tabs button.pin .pl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
@media (max-width:420px){.grid2:has(> label.f){grid-template-columns:1fr} .grid2{gap:14px}}
@media (max-width:640px){.chips{gap:8px} details.grp{margin-bottom:12px} .stack{gap:16px} .lead{font-size:15px;line-height:1.4;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .btn.small{min-height:44px;padding:8px 14px} .chip{min-height:44px;padding:9px 14px} label.ck{min-height:44px;align-items:center} .card{padding:14px} h1{font-size:30px;margin-bottom:8px} .note{font-size:14.5px} nav.tabs button{font-size:12px;min-height:62px} nav.tabs button svg{width:24px;height:24px} summary{min-height:52px}}
label.ft{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
label.ft:first-child{border-top:0} label.ft b{display:block;font-size:16px} label.ft small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px} label.ft em{font-style:normal;color:var(--fg);opacity:.7}
input.sw{-webkit-appearance:none;appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
input.sw:checked{background:var(--ok,#16a34a)} input.sw:checked::after{left:23px}
nav.tabs .zl,nav.tabs .zr{display:contents}

<script>
(() => {
"use strict";
/* start-up safety net: if something throws while the first page is still loading, say what it was instead of hanging */
const bootFail = (why) => { try{ const v = document.getElementById("view"); if (v && v.textContent.includes("Loading your settings")) v.innerHTML = `<div class="card stack"><b>Something stopped the app opening</b><span class="muted">${String(why && (why.message || why.code || why) || "unknown").replace(/[<>&]/g, " ").slice(0, 300)}</span><button class="btn" id="bootRetry">Try again</button></div>`, document.getElementById("bootRetry").onclick = () => location.reload(); }catch{} };
window.addEventListener("error", e => bootFail(e.error || e.message)); window.addEventListener("unhandledrejection", e => bootFail(e.reason));
/* .57: cleanup build. Dead code removed, Settings regrouped, More search added, bar accepts any number of picks. */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GS = "Google Sheets", GD = "Google Drive";
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const CATS = ["Car, van & travel","Postage & packaging","Phone, stationery & office costs"];

/* ---------- settings: saved to your account (every device), cached on this device ---------- */
const DEFAULT_MSGS = [
  {id:"m1", name:"Thanks for buying", text:"Hi {buyer}, thanks for buying the {item}. It'll be packed carefully and posted within 1 working day. Any questions, just message me.\n{seller}"},
  {id:"m2", name:"It's been posted", text:"Hi {buyer}, your {item} is on its way. The tracking is on your order page.\nThanks again, {seller}"},
  {id:"m3", name:"Ask for feedback", text:"Hi {buyer}, I hope the {item} arrived safely. If you're happy with it, feedback really helps a small seller. If anything's not right, message me first and I'll sort it out.\n{seller}"},
  {id:"m4", name:"Reply to an offer", text:"Hi, thanks for your offer on the {item}. The lowest I can do is £___. Let me know if that works for you.\n{seller}"},
  {id:"m5", name:"Problem with an order", text:"Hi {buyer}, sorry to hear there's a problem with the {item}. Could you send me a photo? I'll sort it out as quickly as I can. Ref: {sku}\n{seller}"}
];
const DEFAULTS = {
  v:2, trackers:[], active:"", username:"", boxes:"", skuOn:true, sources:"", sells:"eBay",
  carbootDays:[6,0], returnsWorking:false, noPhotosLine:true, titleWords:"", postage:"",
  descExtra:"", cardNote:"", messages:null, photosOn:true, photoRoot:"", boxFolders:null, skillAt:0, dlLink:"", chatAsked:false, cats:null, carboot:true, askFee:true, places:null, show:null, colDefs:{}, tabRO:{}, layout:null, layoutV:2, updatedAt:0
};
/* extras are off until switched on in Settings › Menu; Sold, Expenses and Log a sale stay on. People who already had the app keep what they had (see migrate), except Boxes. */
const SHOW_DEF = {boxes:false, insights:false, sold:true, messages:false, expense:true, chat:false, miles:false, own:false, sheet:false, tabs:false, sale:true};
const SHOW_OLD = {boxes:true, insights:true, sold:true, messages:true, expense:true, chat:true, miles:true, own:true, sheet:true, tabs:true, sale:true};
/* Your spreadsheet is hidden for now (More tile and the Extras switch). Set to false to bring it back. */
const SHEET_HIDDEN = true;
const TEMPLATE_COPY ="https://docs.google.com/spreadsheets/d/1Jnx4DbjJLQQITilZacM3FYkcbgx16Zn6mZPx2GI1G44/copy";
function migrate(o){
  o = {...(o||{})};
  if (!Array.isArray(o.trackers)){
    o.trackers = [];
    if (o.trackerId) o.trackers.push({id:o.trackerId, name:o.trackerName||"My tracker", label:"Mine", def:true});
    if (o.partnerOn && o.partnerId) o.trackers.push({id:o.partnerId, name:o.partnerName||"Second tracker", label:"Partner", def:true});
    o.active = o.trackerId || "";
  }
  ["trackerId","trackerName","partnerId","partnerName","partnerOn"].forEach(k => delete o[k]);
  const s = {...DEFAULTS, ...o};
  s.trackers = s.trackers.filter(t => t && t.id).map(t => ({...t, id:t.id, name:t.name||"Tracker", label:t.label||"", def:t.def!==false}));
  if (!Array.isArray(s.custom)) s.custom = [];
  if (!Array.isArray(s.messages)) s.messages = DEFAULT_MSGS.map(m => ({...m}));
  if (!Array.isArray(s.cats) || !s.cats.length) s.cats = CATS.slice();
  { const had = s.trackers.length > 0 && !o.showV9; s.show = {...(had ? SHOW_OLD : SHOW_DEF), ...(s.show||{})}; if (had) s.show.boxes = false; s.showV9 = true; } if (!s.colDefs || typeof s.colDefs !== "object" || Array.isArray(s.colDefs)) s.colDefs = {}; if (!s.tabRO || typeof s.tabRO !== "object" || Array.isArray(s.tabRO)) s.tabRO = {}; s.carboot = s.carboot !== false; s.askFee = s.askFee !== false; migratePlaces(s); if (!s.layout || typeof s.layout!=="object" || Array.isArray(s.layout) || s.layoutV !== 2){ s.layout = {}; s.layoutV = 2; }
  if (!s.trackers.some(t => t.id===s.active)) s.active = s.trackers[0]?.id || "";
  return s;
}
const LKEY = "reseller-desk";
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"{}"); }catch{ return {}; } }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch{} }
let S = migrate(loadLocal());
/* light / dark: "auto" follows the phone; the choice is saved with your settings */
const applyTheme = () => { try{ const t = S.theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }catch{} };
applyTheme();

/* ---------- PER-SHEET SETTINGS. Everything about how a sheet works (usernames, sites, couriers, places, carboots, SKUs, boxes,
   condition/notes/couriers, expenses, miles, photos, listing wording) belongs to a sheet. Sheets share one set (S.globalCfg) unless
   "Same settings as my other sheets" is off for that sheet (t.ownCfg, its own t.cfg). S always holds the ACTIVE sheet's values,
   so the rest of the app just reads S. save() files them under the right sheet; switching sheet loads that sheet's set. ---------- */
const SHEET_KEYS = ["username","usernames","postage","postCost","feePct","couriers","sells","places","carboot","askFee","carbootDays","cats","skuOn","boxes","boxInfo","feat","photosOn","returnsWorking","noPhotosLine","titleWords","descExtra","cardNote"];
const cfgPack = () => { const o = {}; SHEET_KEYS.forEach(k => { if (S[k] !== undefined) o[k] = JSON.parse(JSON.stringify(S[k])); }); o.showExp = S.show.expense !== false; o.showMiles = S.show.miles !== false; return o; };
const cfgApply = c => { if (!c) return; SHEET_KEYS.forEach(k => { if (k in c) S[k] = JSON.parse(JSON.stringify(c[k])); else if (k in DEFAULTS) S[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); else delete S[k]; }); if ("showExp" in c) S.show = {...S.show, expense:c.showExp, miles:c.showMiles};
  if (!Array.isArray(S.cats) || !S.cats.length) S.cats = CATS.slice(); try{ migratePlaces(S); }catch{} if (!Array.isArray(S.places)) S.places = []; };
/* sync groups: sheets in a group share one set (g.cfg); any other sheet has its own (t.cfg). */
function cfgGroups(){
  if (!Array.isArray(S.cfgGroups)){ S.cfgGroups = [];
    const shared = S.trackers.filter(t => !t.ownCfg);
    if (S.globalCfg && shared.length > 1) S.cfgGroups.push({id:"g" + Date.now(), sheets:shared.map(t => t.id), cfg:S.globalCfg});
    else if (S.globalCfg) shared.forEach(t => { if (!t.cfg) t.cfg = JSON.parse(JSON.stringify(S.globalCfg)); }); }
  const ids = new Set(S.trackers.map(t => t.id));
  /* tidy IN PLACE (callers keep references to these group objects) */
  S.cfgGroups.forEach(g => { g.sheets = g.sheets.filter(id => ids.has(id)); });
  for (let i = S.cfgGroups.length - 1; i >= 0; i--){ const g = S.cfgGroups[i]; if (g.sheets.length > 1) continue; g.sheets.forEach(id => { const t = S.trackers.find(x => x.id === id); if (t && !t.cfg) t.cfg = g.cfg; }); S.cfgGroups.splice(i, 1); }
  return S.cfgGroups;
}
const groupOf = id => cfgGroups().find(g => g.sheets.includes(id));
const cfgOf = t => !t ? cfgPack() : t.id === S.active ? cfgPack() : ((groupOf(t.id) || {}).cfg || t.cfg || S.globalCfg || cfgPack());
function cfgStore(id, c){ const g = groupOf(id); if (g){ g.cfg = c; return; } const t = S.trackers.find(x => x.id === id); if (t) t.cfg = c; }
let CFG_FOR = S.active;
function cfgFile(){
  const now = S.active, old = CFG_FOR;
  if (old && old !== now){ if (S.trackers.some(t => t.id === old)) cfgStore(old, cfgPack());
    const nt = S.trackers.find(t => t.id === now); if (nt) cfgApply((groupOf(now) || {}).cfg || nt.cfg);
    CFG_FOR = now; if (typeof CUR !== "undefined" && (CUR === "setup" || CUR === "sheetset")) setTimeout(() => { try{ go(CUR); }catch{} }, 0); return; }
  CFG_FOR = now; if (now) cfgStore(now, cfgPack());
}
let DB = null, SREF = null, SYNC = "loading", writeChain = Promise.resolve();
function save(){
  try{ cfgFile(); }catch{}
  S.updatedAt = Date.now(); saveLocal();
  if (!SREF) return;
  const body = {settings: JSON.stringify(S), updatedAt: S.updatedAt};
  writeChain = writeChain.then(() => SREF.set(body)).then(() => { SYNC = "account"; }).catch(() => { SYNC = "error"; drawSync(); });
  if (typeof sheetSyncSoon === "function") sheetSyncSoon();
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]);
const syncReady = Promise.race([(async () => {
  try{
    const [db, user] = await withTimeout(Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]), 9000);
    if (!db || !user){ SYNC = "local"; return; }
    const uid = await user.id(); if (!uid){ SYNC = "local"; return; }
    DB = db; SREF = db.collection("data/users/" + uid).doc("settings");
    const snap = await withTimeout(SREF.get(), 10000);
    if (snap.exists){
      let remote = {}; try{ remote = JSON.parse(snap.data().settings || "{}"); }catch{}
      S = migrate(remote); CFG_FOR = S.active; saveLocal(); SYNC = "account"; return;
    }
    /* nothing saved to the account yet: use the owner's preset, or what this device has */
    let preset = null;
    if (await user.isOwner().catch(() => false)){
      try{ const p = await withTimeout(db.doc("owner/preset").get(), 8000); if (p.exists) preset = JSON.parse(p.data().settings || "{}"); }catch{}
    }
    if (preset && !S.trackers.length) S = migrate({...preset, messages:S.messages});
    else if (preset){ for (const t of migrate(preset).trackers) if (!S.trackers.some(x => x.id===t.id)) S.trackers.push(t); }
    SYNC = "account"; if (S.trackers.length) save();
  }catch{ SYNC = DB ? "error" : "local"; }
})(), new Promise(res => setTimeout(() => { if (SYNC === "loading") SYNC = DB ? "error" : "local"; res(); }, 12000))]);

const list = s => String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const tName = t => t ? (t.label || t.name) : "";
const activeT = () => S.trackers.find(t => t.id===S.active) || S.trackers[0] || null;
const defIds = () => { const d = S.trackers.filter(t => t.def).map(t => t.id); return d.length ? d : (S.active ? [S.active] : []); };

/* ---------- dates & money ---------- */
const pad = n => String(n).padStart(2,"0");
const fmtD = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const parseUK = s => { const m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(String(s||"").trim()); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; };
const serial = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899,11,30)) / 86400000);
const num = v => { if (typeof v === "number") return v; let s = String(v??"").trim(); const neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/[^\d.\-]/g,"")); s = s.replace(/[^\d.]/g,""); const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : 0; };
const gbp = n => (n<0?"-£":"£") + Math.abs(n).toFixed(2);
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

/* ---------- UI helpers ---------- */
function toast(msg){ const h = $("#toastHost"); h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=>h.innerHTML="", 3200); }
async function copy(text, btn){
  const done = () => { if(btn){ const o = btn.textContent; btn.textContent = "Copied"; setTimeout(()=>btn.textContent = o, 1400); } };
  try{ await navigator.clipboard.writeText(text); done(); }
  catch{ const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch{ toast("Select the text and copy it yourself"); } ta.remove(); }
}
function openPanel(html){ $("#overlay").innerHTML = `<div class="sheet-panel" id="panelBg"><div class="pane" role="dialog" aria-modal="true">${html}</div></div>`; $("#panelBg").addEventListener("click", e=>{ if(e.target.id==="panelBg") closePanel(); }); }
function closePanel(){ $("#overlay").innerHTML = ""; }
const busy = (btn, on, label) => { if(!btn) return; if(on){ btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(label||"Working…")}`; } else { btn.disabled = false; btn.innerHTML = btn.dataset.l || btn.innerHTML; } };
function pick(sel, set){ const el = $(sel); if(!el) return; el.onclick = e => { const b = e.target.closest("button"); if(!b) return; set(b.dataset.v); el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); }; }

/* "Save to" chips: pick which trackers an action writes to */
function targetChips(key, ids, label="Save to"){
  if (S.trackers.length < 2) return "";
  return `<div><div class="lab">${esc(label)}</div><div class="chips" id="tg-${key}">${S.trackers.map(t=>`<button class="chip" data-v="${esc(t.id)}" aria-pressed="${ids.includes(t.id)}">${esc(tName(t))}</button>`).join("")}</div></div>`;
}
function bindTargets(key){ const el = $("#tg-"+key); if (el) el.onclick = e => { const b = e.target.closest("button"); if(!b) return; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true"); }; }
function readTargets(key, ids){ const el = $("#tg-"+key); const pickd = el ? [...el.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v) : ids; return S.trackers.filter(t => pickd.includes(t.id)); }

/* ---------- capabilities ---------- */
let mcp = null, sample = null, imgOK = false;
const ready = (async () => {
  try{ mcp = await window.claude?.use?.("mcp"); }catch{ mcp = null; }
  try{ sample = await window.claude?.use?.("sample"); const l = sample ? await sample.limits().catch(()=>null) : null; imgOK = !!l?.images; }catch{ sample = null; }
})();
function mcpMsg(e, server=GS){
  switch(e?.code){
    case "server_not_connected": return `${server} isn't connected to your Claude account. Add it in claude.ai: Settings → Connectors → ${server}.`;
    case "needs_reauth": return `${server} needs signing in again. Go to claude.ai: Settings → Connectors and reconnect ${server}.`;
    case "not_in_manifest": case "approval_required": return `This app needs your OK to use ${server}. Tap the button again and choose Allow.`;
    case "blocked_by_policy": return `Your organisation blocks this ${server} action.`;
    case "selection_required": return `You have more than one ${server} connection. Choose one in the prompt claude.ai shows, then try again.`;
    case "tool_error": return `${server} said no: ${String(e.message||"").slice(0,220)}. Check the link is right and that your Google account can edit that sheet.`;
    case "server_unavailable": return `${server} didn't answer. Wait a moment and try again.`;
    case "not_granted": case "capability_disabled": return "Open this app on claude.ai (signed in) to connect your sheet.";
    default: return `Something went wrong talking to ${server} (${e?.code||"unknown"}). Try again.`;
  }
}
function sampleMsg(e){
  switch(e?.code){
    case "not_granted": case "sampling_disabled": return "Claude isn't allowed for this app, so it can't write listings. Everything else still works.";
    case "rate_limited": return "You've hit your Claude usage limit for now. Try again a bit later.";
    case "image_rejected": return "One of the photos couldn't be read. Try a different photo (JPG or PNG).";
    case "invalid_json": return "Claude's answer came back jumbled. Tap the button again.";
    case "refused": return "Claude wouldn't write this one. Try different photos or notes.";
    case "session_expired": return "Sign in to claude.ai again, then try again.";
    default: return "Claude couldn't finish. Tap the button to try again.";
  }
}

/* ---------- Google Sheets calls ---------- */
async function gs(tool, input){ await ready; if(!mcp) throw {code:"capability_disabled"}; const r = await mcp.callTool(GS, tool, input, {cache:false}); return r.payload ?? r; }
const getVals = (id, range) => gs("get_values", {spreadsheetId:id, range}).then(p => (p && p.values) || []);
const batch = (id, requests) => gs("update_spreadsheet", {spreadsheetId:id, requests});
async function sheetIds(id){
  const p = await gs("get_spreadsheet", {spreadsheetId:id, fields:["properties.title","sheets.properties.sheetId","sheets.properties.title"]});
  const out = {title:p?.properties?.title||"", tabs:{}}; for (const s of (p?.sheets||[])) out.tabs[s.properties.title] = s.properties.sheetId; return out;
}
const idCache = {};
async function tabId(id, name){ if(!idCache[id]) idCache[id] = await sheetIds(id); const v = idCache[id].tabs[name]; if(v===undefined) throw {code:"tool_error", message:`no "${name}" tab in that sheet`}; return v; }
function cell(v){ if (v===null) return {}; if (v && typeof v==="object" && "date" in v) return {userEnteredValue:{numberValue:v.date}, userEnteredFormat:{numberFormat:{type:"DATE",pattern:v.pat||"dd/mm/yyyy"}}};
  if (typeof v==="number") return {userEnteredValue:{numberValue:v}}; return {userEnteredValue:{stringValue:String(v)}}; }
function rowRequests(sheetId, row, cells){
  const isDate = c => cells[c] !== null && cells[c] && typeof cells[c]==="object";
  const cols = Object.keys(cells).map(Number).sort((a,b)=>a-b); const reqs = []; let i = 0;
  while (i < cols.length){ let j = i;
    if (!isDate(cols[i])) while (j+1 < cols.length && cols[j+1] === cols[j]+1 && !isDate(cols[j+1])) j++;
    const vals = cols.slice(i, j+1).map(c => cell(cells[c]));
    reqs.push({updateCells:{start:{sheetId, rowIndex:row, columnIndex:cols[i]}, rows:[{values:vals}], fields: isDate(cols[i]) ? "userEnteredValue,userEnteredFormat.numberFormat" : "userEnteredValue"}}); i = j+1; }
  return reqs;
}
/* find an item's row in any tracker: SKU first, then title */
function findRow(v, r, status){
  const ok = x => !status || x[1]===status;
  let i = r.sku ? v.findIndex((x,k) => k>0 && (x[10]||"").trim()===r.sku.trim() && ok(x)) : -1;
  if (i<0) i = v.findIndex((x,k) => k>0 && (x[0]||"").trim().toLowerCase()===r.item.trim().toLowerCase() && ok(x));
  return i;
}

/* ---------- TRACKER SHAPE: any spreadsheet layout.
   A tracker made from the template has no t.map and works exactly as before.
   Any other sheet gets t.map = {s:{tab, hr, c:[12], via, ph}, e:{tab, hr, c:[4]}|null, df, dpat, sw:{Sold,Listed,Returned}}
   c[i] = which of THEIR columns holds template field i (-1 = they don't have it). hr = their heading row (0-based).

function isBoot(n){ return /car\s*-?\s*boot/i.test(String(n || "")); }

async function autoPlaceFee(targets, d, P){

  const reason = `Entry fee: ${P.name}`, amt = num(P.feeAmt), cats = (S.cats && S.cats.length) ? S.cats : CATS;
  const cat = P.cat && cats.includes(P.cat) ? P.cat : (cats.find(c => /travel/i.test(c)) || cats[0]), added = [], had = [];
  try{ for (const t of targets){ if (!eTab(t)) continue; const v = await expV(t);
      if (v.some((x,k) => k > 0 && String(x[2] || "").trim().toLowerCase() === reason.toLowerCase() && parseUK(x[0]) && +parseUK(x[0]) === +d)){ had.push(tName(t)); continue; }
      const sid = await expTabId(t); const have = [...new Set(v.slice(1).map(x => String(x[3] || "").trim()).filter(Boolean))];
      let last = 0; v.forEach((x,k) => { if (String(x[0] ?? "").trim() || String(x[1] ?? "").trim()) last = k; });
      await batch(t.id, rowRequests(sid, last+1, mapECells(t, {0:{date:serial(d)}, 1:amt, 2:reason, 3:catMatch(cat, have)}))); added.push(tName(t)); }
    box.innerHTML = added.length ? `<div class="note ok" style="margin-top:10px">Entry fee for ${esc(P.name)} on ${DAYS[d.getDay()]} ${fmtD(d)} added automatically: ${gbp(amt)} (${esc(added.join(", "))}). Wrong amount? Change it in Expenses, or update the usual fee in Settings › Buying.</div>` : "";
  }catch(e){ box.innerHTML = `<div class="note err" style="margin-top:10px">The item is saved, but the entry fee wasn't added: ${esc(mcpMsg(e))} Add it in Expenses.</div>`; }
}
/* after saving an item: ask what they paid to get in, once per place per day */
async function askPlaceFee(targets, d, P){
  const box = $("#bfAsk2"); if (!box || !d || !P) return;
  const reason = `Entry fee: ${P.name}`, ts = [];
  for (const t of targets){ try{ if (!eTab(t)) continue; const v = await expV(t);
    if (v.some((x,k) => k > 0 && String(x[2] || "").trim().toLowerCase() === reason.toLowerCase() && parseUK(x[0]) && +parseUK(x[0]) === +d)) continue; ts.push({t, v}); }catch{} }
  if (!ts.length || !$("#bfAsk2")) return;
  const cats = (S.cats && S.cats.length) ? S.cats : CATS; let cat = P.cat && cats.includes(P.cat) ? P.cat : (cats.find(c => /travel/i.test(c)) || cats[0]);
  box.innerHTML = `<div class="card stack" style="margin-top:10px;border-left:3px solid var(--hl)">
    <div><b>Did you pay to get into ${esc(P.name)} on ${DAYS[d.getDay()]} ${fmtD(d)}?</b><div class="muted" style="font-size:14.5px">Asked once per visit. It's saved as an expense.</div></div>
    <div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" min="0" id="pfAmt" placeholder="0.00"></div>
    <div><div class="lab">Expense type</div><div class="chips" id="pfCat">${cats.map(c => `<button class="chip" data-v="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("")}</div></div>
    <div id="pfMsg"></div><div class="row"><button class="btn small" id="pfSave">Save fee</button><button class="btn small ghost" id="pfNo">Didn't pay</button><button class="btn small ghost" id="pfStop">Stop asking for ${esc(P.name)}</button></div></div>`;
  pick("#pfCat", v => cat = v);
  $("#pfNo").onclick = () => { box.innerHTML = ""; };
  $("#pfStop").onclick = () => { const p = placeOf(P.name); if (p){ p.fee = false; syncPlaces(S); save(); } box.innerHTML = `<div class="note info" style="margin-top:10px">Won't ask about ${esc(P.name)} again. Turn it back on in Settings › Buying.</div>`; };
  $("#pfSave").onclick = async () => { const amt = $("#pfAmt").value; if (amt === "" || num(amt) < 0){ $("#pfMsg").innerHTML = `<div class="note warn">Type what you paid, e.g. 2.00.</div>`; return; }
    const btn = $("#pfSave"); busy(btn, true, "Saving…");
    try{ for (const {t, v} of ts){ const sid = await expTabId(t); const have = [...new Set(v.slice(1).map(x => String(x[3] || "").trim()).filter(Boolean))];
        let last = 0; v.forEach((x,k) => { if (String(x[0] ?? "").trim() || String(x[1] ?? "").trim()) last = k; });
        await batch(t.id, rowRequests(sid, last+1, mapECells(t, {0:{date:serial(d)}, 1:num(amt), 2:reason, 3:catMatch(cat, have)}))); }
      const p = placeOf(P.name); if (p){ p.cat = cat; syncPlaces(S); save(); }
      box.innerHTML = `<div class="note ok" style="margin-top:10px">Entry fee for ${esc(P.name)} on ${fmtD(d)} saved as ${gbp(num(amt))}.</div>`;
    }catch(e){ busy(btn, false); $("#pfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
}

  let src = "";
  const drawSrc = () => { const p = picked(); if (!p.includes(src)) src = p.includes(S.active) ? S.active : (p[0] || ""); $("#sgSrc").innerHTML = p.map(id => `<button class="chip" data-v="${esc(id)}" aria-pressed="${id===src}">${esc(nm(id))}</button>`).join("") || `<span class="muted" style="font-size:14px">Pick sheets first</span>`; };

    cfgStore(S.active, cfgPack()); g.sheets.forEach(id => { const t = S.trackers.find(x => x.id === id); if (t) t.cfg = JSON.parse(JSON.stringify(g.cfg)); });
    S.cfgGroups = cfgGroups().filter(x => x.id !== g.id); save(); closePanel(); toast("Stopped syncing. Each sheet keeps its own copy."); if (after) after(); };
  $("#sgGo").onclick = () => { const p = picked(); if (p.length < 2){ $("#sgMsg").innerHTML = `<div class="note warn">Pick at least 2 sheets.</div>`; return; }
    cfgStore(S.active, cfgPack()); const c = JSON.parse(JSON.stringify(cfgOf(S.trackers.find(x => x.id === src))));
    cfgGroups().forEach(g => { g.sheets = g.sheets.filter(id => !p.includes(id)); }); cfgGroups();
    S.cfgGroups.push({id:"g" + Date.now(), sheets:p, cfg:c}); if (p.includes(S.active)) cfgApply(c);
    save(); drawNav(); closePanel(); toast(`Synced: ${p.map(nm).join(" + ")}`); if (after) after(); };

function bindPlacesEditor(redraw){
  const el = $("#plList"); if (!el) return;
  const idx = e => +e.target.closest("[data-pi]").dataset.pi;
  el.onclick = e => { const card = e.target.closest("[data-pi]"); if (!card) return; const p = S.places[idx(e)];
    if (e.target.closest("[data-prm]")){ const b = e.target.closest("[data-prm]"); if (!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "Tap again"; return; } S.places.splice(idx(e), 1); syncPlaces(S); save(); redraw(); return; }
    if (e.target.closest("[data-pch]")){ e.preventDefault(); if (p.manual){ delete p.manual; syncPlaces(S); learnDays(); } else p.manual = true; syncPlaces(S); save(); redraw(); return; }
    const d = e.target.closest("[data-pd] button"); if (d){ const v = +d.dataset.v; p.manual = true; p.days = p.days.includes(v) ? p.days.filter(x => x !== v) : [...p.days, v]; syncPlaces(S); save(); redraw(); } };
  el.onchange = e => { if (!e.target.closest("[data-pi]")) return; const p = S.places[idx(e)];
    if (e.target.matches("[data-pf]")){ p.fee = e.target.checked; if (!p.fee) delete p.auto; syncPlaces(S); save(); redraw(); return; }
    if (e.target.matches("[data-pa]")){ p.auto = e.target.checked; syncPlaces(S); save(); redraw(); return; }
    if (e.target.matches("[data-pamt]")){ const v = num(e.target.value); if (v > 0) p.feeAmt = v; else delete p.feeAmt; if (!(v > 0) && p.auto) toast("Type the usual fee, or it will ask you each time"); }
    if (e.target.matches("[data-pn]")){ const n = e.target.value.trim(); if (n) p.name = n; }
    syncPlaces(S); save(); };
  $("#plAdd").onclick = () => { const n = $("#plNew").value.trim(); if (!n) return; if (placeOf(n)){ toast(`${n} is already there`); return; } S.places.push({name:n, ...placeDefaults(n)}); syncPlaces(S); save(); redraw(); toast(`${n} added`); };
}

const listEd = (id, items, ph, noun) => `<div id="${id}" class="stack" style="gap:8px">${listEdInner(items, ph, noun)}</div>`;
function bindListEd(id, get, set, ph, noun, o={}){
  const el = $("#"+id); if (!el) return;
  const redraw = () => { el.innerHTML = listEdInner(get(), ph, noun); };
  const dup = (a, v, skip) => a.some((x,i) => i !== skip && x.toLowerCase() === v.toLowerCase());
  const add = () => { const inp = el.querySelector("[data-ln]"); const raw = inp.value.trim(); if (!raw) return; const a = get(); let n = 0;
    (o.split ? raw.split(",").map(x => x.trim()).filter(Boolean) : [raw]).forEach(v => { if (!dup(a, v, -1)){ a.push(v); n++; } });

  const page = el.parentElement.dataset.page, editing = WEDIT===page, mouse = e.pointerType==="mouse";

function wMove(ev){

  const t = kids.find(k => { if (k===D.el) return false; const r = k.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; });
  if (!t){ D.last = null; const br = D.board.getBoundingClientRect(); if (y > br.bottom && kids[kids.length-1]!==D.el) wFlip(D.board, () => D.board.appendChild(D.el)); return; }
  if (t===D.last) return;
  const i = kids.indexOf(D.el), j = kids.indexOf(t);

}
function wScroll(){
  const D = WDRAG; if (!D){ return; } const edge = 80, top = D.y < edge + 40, bot = D.y > innerHeight - edge - 70;
  if (top || bot){ window.scrollBy(0, top ? -12 : 12); wTarget(D.x ?? 0, D.y); D.raf = requestAnimationFrame(wScroll); } else D.raf = 0;

function wEnd(cancel){

const SITE_WHERE = s => /ebay/i.test(s) ? "eBay app › Selling › Sold" : /vinted/i.test(s) ? "Vinted › your profile › Sold items" : /facebook|marketplace/i.test(s) ? "Facebook › Marketplace › Your listings › Sold" : /depop/i.test(s) ? "Depop › Selling › Sold" : /etsy/i.test(s) ? "Etsy › Shop Manager › Orders" : `${s}`;
const isFb = s => /facebook|marketplace|^fb\b/i.test(String(s||"").trim());
/* "FB", "Facebook Marketplace" and "Facebook" are the same site; so are "eBay UK" and "eBay" */
function sameSite(v, site){ v = String(v||"").trim().toLowerCase(); site = String(site||"").trim().toLowerCase(); if (!v || !site) return false; return v===site || v.includes(site) || site.includes(v) || (isFb(v) && isFb(site)); }
/* the sites to check: the ones they sell on, plus any other site found in their Sold on column */
function checkSites(rows){ const list = sells().slice(); rows.forEach(r => { const v = String(r.via||"").trim(); if (v && (r.status==="Sold"||r.status==="Returned") && !list.some(x => sameSite(v, x))) list.push(v); }); return list; }
function siteStats(rows, site, first){
  const now = new Date(), yr = now.getFullYear(), mo = now.getMonth();
  const mine = rows.filter(r => (r.status==="Sold" || r.status==="Returned") && (sameSite(r.via, site) || (first && !String(r.via||"").trim())));
  const when = r => parseUK(r.soldOn), inY = r => { const d = when(r); return d && d.getFullYear()===yr; }, inM = r => { const d = when(r); return d && d.getFullYear()===yr && d.getMonth()===mo; };
  const sold = mine.filter(r => r.status==="Sold").sort((a,b) => (when(b)||0) - (when(a)||0));
  const y = sold.filter(inY), m = sold.filter(inM);
  return {site, yr, y:y.length, ySum:y.reduce((a,r) => a + num(r.sold), 0), m:m.length, mSum:m.reduce((a,r) => a + num(r.sold), 0),
    ret: mine.filter(r => r.status==="Returned" && inY(r)).length, list: sold, noSite: first ? mine.filter(r => !String(r.via||"").trim()).length : 0};
}

  const hm = ["HMRC Summary","HMRC_Summary"].find(n => n in a.tabs);

const ADMIN = null;

const short = n => { const a = Math.abs(n), s = n<0?"-":""; return a>=1000 ? `${s}£${(a/1000).toFixed(a>=10000?0:1)}k` : `${s}£${Math.round(a)}`; };
function nice(v){ if (v<=0) return 0; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function frame(vals, H, W=340, T=10){
  const L = 38, R = 6, B = 22, iw = W-L-R, ih = H-T-B;

function hits(f, n, vals, labels, fmt, xs){

/* ---------- description preview: only safe, simple tags ---------- */
function cleanHtml(src){
  const root = new DOMParser().parseFromString(String(src||""), "text/html").body;
  const ok = new Set(["P","B","STRONG","I","EM","U","H1","H2","H3","H4","UL","OL","LI","BR","DIV","SPAN","CENTER","FONT"]);
  const drop = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","TEMPLATE","NOSCRIPT"]);
  const walk = n => [...n.childNodes].map(c => {
    if (c.nodeType===3) return esc(c.textContent);
    if (c.nodeType!==1 || drop.has(c.tagName)) return "";
    if (c.tagName==="BR") return "<br>";
    const t = c.tagName.toLowerCase(); return ok.has(c.tagName) ? `<${t}>${walk(c)}</${t}>` : walk(c);
  }).join("");
  return walk(root);
}
function withExtra(html){
  const x = String(S.descExtra||"").trim(); if (!x) return html;
  return html.includes(esc(x)) || html.includes(x) ? html : `${html}\n<p>${esc(x)}</p>`;
}

/* after saving a carboot buy: ask the entry fee for that day, once per day (an answer is kept in Carboot_entry I:J) */
async function askBootFee(targets, d){
  if (!d || !$("#bfAsk")) return;
  const found = [];
  for (const t of targets){
    try{ const v = await getVals(t.id, "Carboot_entry!I1:J400");
      if (!/fee change/i.test(String((v[0]||[])[0]||""))) continue;
      if (v.some((x,k) => k>0 && parseUK(x[0]) && +parseUK(x[0])===+d)) continue;
      found.push({t, v});
    }catch{}
  }
  const box = $("#bfAsk"); if (!found.length || !box) return;
  const usual = d.getDay()===6 ? 2 : d.getDay()===0 ? 4 : 0;
  box.innerHTML = `<div class="card stack" style="margin-top:10px;border-left:3px solid var(--hl)">
    <div><b>What did you pay to get in on ${DAYS[d.getDay()]} ${fmtD(d)}?</b>
    <div class="muted" style="font-size:14.5px">Asked once per carboot day. Usually £2 on a Saturday (one carboot), £4 on a Sunday (two).</div></div>
    <div class="chips" id="bfChips">${[0,1,2,3,4,6].map(n=>`<button class="chip" data-v="${n}" aria-pressed="${n===usual}">${n?gbp(n):"Free"}</button>`).join("")}</div>
    <label class="f">Or type it<div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" min="0" id="bfAskAmt" value="${usual.toFixed(2)}"></div></label>
    <div id="bfAskMsg"></div>
    <div class="row"><button class="btn small" id="bfAskSave">Save fee</button><button class="btn small ghost" id="bfAskSkip">Skip</button></div></div>`;
  $("#bfChips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
    $("#bfChips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b)); $("#bfAskAmt").value = (+b.dataset.v).toFixed(2); };
  $("#bfAskAmt").oninput = e => { $("#bfChips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", e.target.value!=="" && +x.dataset.v===num(e.target.value))); };
  $("#bfAskSkip").onclick = () => { box.innerHTML = `<div class="note info" style="margin-top:10px">Kept the usual ${gbp(usual)}. You'll be asked again with the next carboot buy for this day, or tap it in Expenses.</div>`; };
  $("#bfAskSave").onclick = async () => { const btn = $("#bfAskSave"), amt = $("#bfAskAmt").value;
    if (amt==="" || num(amt)<0){ $("#bfAskMsg").innerHTML = `<div class="note warn">Type the fee, e.g. 2.00.</div>`; return; }
    busy(btn, true, "Saving…");
    try{
      for (const {t, v} of found){ const sid = await tabId(t.id, "Carboot_entry");
        let last = 0; v.forEach((x,k) => { if (String(x[0]??"").trim()) last = k; });
        await batch(t.id, rowRequests(sid, last+1, {8:{date:serial(d)}, 9:num(amt)})); }
      HOME_C = null;
      box.innerHTML = `<div class="note ok" style="margin-top:10px">Entry fee for ${fmtD(d)} saved as ${gbp(num(amt))}. Change it any time in Expenses.</div>`;
    }catch(e){ busy(btn, false); $("#bfAskMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
}

}

      const idx = v.findIndex((x,k) => k>0 && parseUK(x[0]) && d && +parseUK(x[0])===+d);
      const usual = d ? (d.getDay()===6 ? 2 : d.getDay()===0 ? 4 : 0) : 0;

        ${idx>0?`<button class="btn wide ghost" id="bfReset">Go back to the usual ${gbp(usual)}</button>`:""}<button class="btn wide ghost" id="bfClose">Close</button>`;
      $("#bfClose").onclick = closePanel;

        if (amt==="" || num(amt)<0){ $("#bfMsg").innerHTML = `<div class="note warn">Type the fee, e.g. 2.00.</div>`; return; }
        busy(btn, true, "Saving…");
        try{ const sid = await tabId(t.id, "Carboot_entry"); let row = idx;
          if (row<0){ let last = 0; v.forEach((x,k) => { if (String(x[0]??"").trim()) last = k; }); row = last+1; }
          await batch(t.id, rowRequests(sid, row, {8:{date:serial(d)}, 9:num(amt)})); toast(`Fee for ${b.date} set to ${gbp(num(amt))}`); done();
        }catch(e){ busy(btn, false); $("#bfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
      $("#bfReset") && ($("#bfReset").onclick = async () => { const btn = $("#bfReset"); busy(btn, true, "Saving…");
        try{ const sid = await tabId(t.id, "Carboot_entry"); await batch(t.id, rowRequests(sid, idx, {8:null, 9:null})); toast(`Back to the usual ${gbp(usual)}`); done(); }
        catch(e){ busy(btn, false); $("#bfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } });
    }catch(e){ if (body()) body().innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
  }
  load();
}
function expensePanel(r){
  const cats = S.cats.slice(); if (r && r.cat && !cats.includes(r.cat)) cats.push(r.cat);
  EXP.cat = r ? r.cat : EXP.cat;
  const ids = r ? [S.active] : defIds();
  openPanel(`<h2 style="margin-top:0">${r?"Edit expense":"Add an expense"}</h2>
    ${!r && S.carboot?`<div class="note info" style="margin-bottom:14px">Carboot entry fees are added automatically on days you bought stock at a carboot. Only add one here if you went and bought nothing. To change a fee (say you only went to one), tap it in the list.</div>`:""}
    <div class="stack">
    ${!r && (S.places||[]).some(p => p.fee && !isBoot(p.name)) ? `<div><div class="lab">Paid to get in somewhere? <small>Tap to fill it in.</small></div><div class="chips" id="eFees">${S.places.filter(p => p.fee && !isBoot(p.name)).map(p => `<button type="button" class="chip" data-pn="${esc(p.name)}" aria-pressed="false">${esc(p.name)}${num(p.feeAmt)>0 ? " " + gbp(num(p.feeAmt)) : ""}</button>`).join("")}</div></div>` : ""}
    <div class="grid2"><label class="f">Amount<div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" id="eAmt" value="${r&&r.amount!==""?num(r.amount).toFixed(2):""}"></div></label>
    <label class="f">Date<input type="text" id="eDate" inputmode="numeric" value="${esc(r?r.date:fmtD(today()))}"></label></div>
    <label class="f">What was it?<input type="text" id="eWhy" value="${esc(r?r.reason:"")}" placeholder="e.g. Fragile tape, 6 pack"></label>
    <div><div class="lab">Type <small>Change the list in Settings.</small></div><div class="chips" id="eCat">${cats.map(c=>`<button class="chip" data-v="${esc(c)}" aria-pressed="${EXP.cat===c}">${esc(c)}</button>`).join("")}</div></div>
    ${targetChips("exp", ids, r ? "Change in" : "Add to")}
    <div id="eMsg"></div><button class="btn wide" id="eSave">${r?"Save changes":"Add expense"}</button>
    ${r?`<button class="btn wide ghost" id="eDel" style="color:var(--ret)">Delete expense</button>`:""}
    <button class="btn wide ghost" id="eClose">Close</button></div>`);
  pick("#eCat", v => EXP.cat = v); bindTargets("exp");
  document.querySelectorAll("#eFees [data-pn]").forEach(b => b.onclick = () => { const P = placeOf(b.dataset.pn); if (!P) return; if (num(P.feeAmt) > 0) $("#eAmt").value = num(P.feeAmt).toFixed(2); $("#eWhy").value = `Entry fee: ${P.name}`; const c = P.cat && cats.includes(P.cat) ? P.cat : null; if (c){ EXP.cat = c; document.querySelectorAll("#eCat .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === c)); } });
  const finish = () => { closePanel(); if (CUR==="expense") viewExpense(); };
  $("#eClose").onclick = closePanel;
  /* find this expense in another tracker by its old date, amount and description */
  const findExp = v => v.findIndex((x,k) => k>0 && num(x[1])===num(r.amount) && String(x[2]||"").trim().toLowerCase()===String(r.reason).trim().toLowerCase() && String(x[0]||"").trim()===String(r.date).trim());
  $("#eSave").onclick = async () => {
    const btn = $("#eSave"), msg = $("#eMsg"); const amt = $("#eAmt").value, d = parseUK($("#eDate").value), why = $("#eWhy").value.trim();
    const miss = []; if (amt==="") miss.push("amount"); if(!d) miss.push("date (DD/MM/YYYY)"); if(!why) miss.push("what it was"); if(!EXP.cat) miss.push("type");
    const targets = readTargets("exp", ids); if (!targets.length) miss.push("which tracker");
    if (miss.length){ msg.innerHTML = `<div class="note warn">Still needed: ${esc(miss.join(", "))}.</div>`; return; }
    busy(btn, true, "Saving…"); const done = [];
    try{
      for (const t of targets){
        const sid = await expTabId(t); const v = await expV(t);
        const have = [...new Set(v.slice(1).map(x=>String(x[3]||"").trim()).filter(Boolean))];
        const cat = catMatch(EXP.cat, have);
        if (r){
          const i = findExp(v); if (i<0){ done.push(`${tName(t)}: not found, left alone`); continue; }
          await batch(t.id, rowRequests(sid, i, mapECells(t, {0:{date:serial(d)}, 1:num(amt), 2:why, 3:cat}))); done.push(`${tName(t)}: row ${i+1}`);
        } else {
          if (v.some((x,k)=>k>0 && num(x[1])===num(amt) && (x[2]||"").trim().toLowerCase()===why.toLowerCase() && parseUK(x[0]) && +parseUK(x[0])===+d)){ done.push(`${tName(t)}: already there`); continue; }
          let last = 0; v.forEach((x,k)=>{ if (String(x[0]??"").trim()||String(x[1]??"").trim()) last = k; }); const row = last+1;
          await batch(t.id, rowRequests(sid, row, mapECells(t, {0:{date:serial(d)}, 1:num(amt), 2:why, 3:cat}))); done.push(`${tName(t)}: row ${row+1}`);
        }
      }
      msg.innerHTML = `<div class="note ok"><b>${r?"Saved":"Added"}.</b> ${esc(done.join(" · "))}</div>`; toast(r?"Expense saved":"Expense added");
      btn.textContent = "Done ✓"; btn.disabled = true; $("#eClose").onclick = finish; return;
    }catch(e){ msg.innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
    busy(btn, false);
  };
  $("#eDel") && ($("#eDel").onclick = async () => {
    const b = $("#eDel"), msg = $("#eMsg");
    if (!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; }
    const targets = readTargets("exp", ids); if (!targets.length){ msg.innerHTML = `<div class="note warn">Pick at least one tracker.</div>`; return; }
    busy(b, true, "Deleting…"); const done = [];
    try{
      for (const t of targets){
        const sid = await expTabId(t); const v = await expV(t);
        const i = findExp(v); if (i<0){ done.push(`${tName(t)}: not found`); continue; }
        await batch(t.id, [{deleteDimension:{range:{sheetId:sid, dimension:"ROWS", startIndex:i, endIndex:i+1}}}]); done.push(`${tName(t)}: deleted`);
      }
      msg.innerHTML = `<div class="note ok"><b>Done.</b> ${esc(done.join(" · "))}</div>`; toast("Expense deleted"); b.remove(); $("#eSave").disabled = true; $("#eClose").onclick = finish; return;
    }catch(e){ msg.innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
    busy(b, false);
  });
}

/* ---------- PHOTOS: Google Drive › Reseller Desk Photos › box › item, link kept in a hidden "Photos" column ---------- */
const FOLDER = "application/vnd.google-apps.folder";
const qs = v => String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const PHOTO_CACHE = {};
async function dSearch(q){ const p = await driveCall("search_files", {query:q, pageSize:50, excludeContentSnippets:true}); return (p && p.files) || []; }
async function makeFolder(title, parentId){
  let f; try{ f = await driveCall("create_file", {title, contentMimeType:FOLDER, parentId}); }
  catch{ f = await driveCall("create_file", {title, mimeType:FOLDER, parentId}); }
  if (!f || !f.id) throw {code:"tool_error", message:"a photo folder couldn't be made"}; return f.id;
}
async function findFolder(title, parentId, exact=true){

  return (await dSearch(`${t} and mimeType = '${FOLDER}' and parentId = '${parentId}' and trashed = false`))[0] || null;
}
async function photoRoot(fresh){

}
async function boxFolder(box, fresh){

  const root = await photoRoot(fresh); const f = await findFolder(box, root);
  S.boxFolders[box] = f ? f.id : await makeFolder(box, root); save(); return S.boxFolders[box];
}
const itemFolderName = r => r.sku ? `${r.sku} · ${String(r.item).slice(0,48)}` : String(r.item).slice(0,60);
const folderIdFrom = s => (/folders\/([\w-]{10,})/.exec(String(s||"")) || [])[1] || "";
const ITEM_FOLDERS = {};
async function itemFolder(r, create){
  const key = r.sku || r.item; if (ITEM_FOLDERS[key]) return ITEM_FOLDERS[key];
  const id = await itemFolderFind(r, create); if (id) ITEM_FOLDERS[key] = id; return id;
}
async function itemFolderFind(r, create){
  if (r.photos && folderIdFrom(r.photos)) return folderIdFrom(r.photos);
  const box = r.sku ? boxOf(r.sku) : "No box";
  let parent; try{ parent = create ? await boxFolder(box) : (S.boxFolders||{})[box] || (await findFolder(box, await photoRoot().catch(()=>""))||{}).id; }catch{ parent = null; }
  if (parent){ const f = await findFolder(r.sku || itemFolderName(r), parent, !r.sku); if (f) return f.id; }
  if (!create) return null;
  try{ return await makeFolder(itemFolderName(r), parent || await boxFolder(box)); }
  catch(e){ /* the saved folders may have been deleted: find them again once */ return await makeFolder(itemFolderName(r), await boxFolder(box, true)); }
}
async function shrink(file){
  let src; try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch{ src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", .85));
  return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
}
/* keep the folder link in a hidden "Photos" column of the tracker being viewed */
async function linkPhotos(r, folderId){
  const t = activeT(); if (!t) return;
  if (shp(t)){ const col = shp(t).s.ph ?? -1; if (col < 0) return; const sid = await tabId(t.id, sTab(t)); const v = await salesV(t); const i = findRow(v, r, "");
    if (i > sHr(t)) await batch(t.id, [{updateCells:{start:{sheetId:sid,rowIndex:i,columnIndex:col}, rows:[{values:[{userEnteredValue:{stringValue:`https://drive.google.com/drive/folders/${folderId}`}}]}], fields:"userEnteredValue"}}]); return; }
  const h = (await getVals(t.id, "Sales!A1:Z1"))[0] || []; let col = h.findIndex(x => /^\s*photos?\s*$/i.test(String(x||"")));
  const sid = await tabId(t.id, "Sales"); const reqs = [];
  if (col < 0){ col = 12; for (let i=h.length-1;i>=0;i--){ if (String(h[i]??"").trim()){ col = Math.max(12, i+1); break; } }
    reqs.push({updateCells:{start:{sheetId:sid,rowIndex:0,columnIndex:col}, rows:[{values:[{userEnteredValue:{stringValue:"Photos"}}]}], fields:"userEnteredValue"}},
      {updateDimensionProperties:{range:{sheetId:sid, dimension:"COLUMNS", startIndex:col, endIndex:col+1}, properties:{hiddenByUser:true}, fields:"hiddenByUser"}}); }

  if (reqs.length) await batch(t.id, reqs);

async function savePhotos(r, files, onStep){
  const fid = await itemFolder(r, true); let n = 0;
  const have = await dSearch(`parentId = '${fid}' and mimeType contains 'image/' and trashed = false`).catch(() => []);
  for (const f of files){
    n++; onStep && onStep(n, files.length);
    const b64 = await shrink(f);
    await driveCall("create_file", {title:`${r.sku || "item"} ${String(have.length + n).padStart(2,"0")}.jpg`, contentMimeType:"image/jpeg", base64Content:b64, disableConversionToGoogleType:true, parentId:fid});
  }
  try{ await linkPhotos(r, fid); }catch{}
  delete PHOTO_CACHE["list:"+fid];
  return fid;
}
function b64From(p){
  if (typeof p === "string") return p; if (!p || typeof p !== "object") return "";
  for (const k of ["content","base64Content","data","contents","fileContent","bytes","body"]) if (typeof p[k] === "string") return p[k];
  let best = ""; for (const v of Object.values(p)) if (typeof v === "string" && v.length > best.length) best = v; return best;
}
async function photoUrl(fileId){
  if (PHOTO_CACHE[fileId]) return PHOTO_CACHE[fileId];
  let b = b64From(await driveCall("download_file_content", {fileId})); b = b.replace(/^data:[^,]+,/, "");
  const bin = atob(b), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return PHOTO_CACHE[fileId] = URL.createObjectURL(new Blob([u], {type:"image/jpeg"}));
}

async function getListing(r){
  try{
    const fid = await itemFolder(r, false); if (!fid) return null;
    const all = (await dSearch(`parentId = '${fid}' and title contains 'listing' and trashed = false`)).filter(f => /^listing(-.*)?\.json$/.test(String(f.title)));
    const f = all.filter(x => x.title !== "listing.json").sort((a,b) => String(b.title).localeCompare(String(a.title)))[0] || all.find(x => x.title === "listing.json"); if (!f) return null;

}

const NY_KEEP = /^(summary|hmrc summary|monthly|carboot_entry|tutorial|claude setup|daily|claude memory)$/i;

async function nyEmpty(t, newId, keepListed){

    const keep = r => keepListed && statusCol >= 0 && /^listed$/i.test(String(r[statusCol] ?? "").trim());
    const reqs = []; let kept = 0, cleared = 0;
    for (let i = hr + 1; i < v.length; i++){
      const r = v[i] || []; if (!r.some(c => String(c ?? "").trim())) continue;
      if (keep(r)){ kept++; continue; }
      const cells = {}; for (let j = 0; j < width; j++) if (!fcols.has(j) && String(r[j] ?? "").trim() !== "") cells[j] = null;
      if (Object.keys(cells).length){ reqs.push(...rowRequests(sid, i, cells)); cleared++; }

    if (cleared || kept) done.push(`${tab}: ${cleared} row${cleared===1?"":"s"} emptied${kept ? `, ${kept} still-listed kept` : ""}`);
  }
  /* the template's year cell */
  if (a.tabs["Summary"] !== undefined && !shp(t)){ try{ const c3 = (await getVals(newId, "Summary!C3:C3"))[0] || []; if (/^\d{4}$/.test(String(c3[0] ?? "").trim())) await batch(newId, rowRequests(a.tabs["Summary"], 2, {2:new Date().getFullYear()})); }catch{} }

  if (a.tabs["Carboot_entry"] !== undefined){ try{ const ij = await getVals(newId, "Carboot_entry!I1:J400"); if (/fee change/i.test(String((ij[0]||[])[0]||""))){ const reqs = []; ij.forEach((r, i) => { if (i > 0 && (r||[]).some(c => String(c ?? "").trim())) reqs.push(...rowRequests(a.tabs["Carboot_entry"], i, {8:null, 9:null})); }); if (reqs.length) await batch(newId, reqs); } }catch{} }

function skillMd(){

  const days = (S.carbootDays||[]).map(d => DAYS[d]).join(" and ");

  const msgs = S.messages.map(m => `### ${m.name}\n${m.text}`).join("\n\n");

name: reseller-desk
description: Runs ${seller}'s resale business in chat. Use when they send item photos to list, an order screenshot (sold), a return or refund, or a business expense, or ask about their stock, sales or profit. Reads and writes their Google Sheet tracker${many?"s":""}.
---

# Reseller Desk

You run ${seller}'s resale business, the same way the Reseller Desk app does. Keep replies short and do everything in one go. Only do what they ask.

Ask about anything important that's missing (model if not clear, working status, cost, date bought, where bought, box, faults, what's included) as tappable multiple-choice questions, all at once. Never guess whether an item works.

## Trackers (Google Sheets)
${tr}
${many?`Every new item, sale, return and expense goes in ${defs.join(" AND ")} unless the user says otherwise ("mine only" and so on).`:""}
Only ever add new rows or update the matching row. Never tidy, reformat or "fix" anything else in a sheet.

### Sales tab columns
A Item | B Status (Listed / Sold / Returned) | C Cost | D Sold Price | E Shipping | F Fees | G Profit (formula) | H Date Bought | I Date Sold | J Days to Sell (formula) | K SKU | L Bought from${via.length?` | Sold on (${via.join("; ")})`:""}
- Never write G or J. Never put buyer names or addresses in a sheet.
- Write dates as real dates in DD/MM/YYYY format, not text.

### Expenses tab
Date | Amount | Reason | Category. Categories, word for word: ${S.cats.map(c => `"${c}"`).join(", ")}. If a tracker already uses slightly different wording, copy that tracker's wording.

## New item (listing)
1. From the photos and note, collect: model, status (Tested working / Faulty / Untested), what they paid, date bought, where bought (${list(S.sources).join(" / ")}), ${useBox() ? `box (${list(S.boxes).map(boxLabel).join(" / ")}), ` : ""}faults if faulty, what's included.
${(S.places||[]).some(p => p.days.length)?`2. ${(S.places||[]).filter(p => p.days.length).map(p => `${p.name} only happens on ${dayNames(p.days)}`).join(". ")}. If bought there on another day, use the closest of those days before it. Other places keep the exact date.${(S.places||[]).some(p => p.fee && !isBoot(p.name))?` For ${(S.places||[]).filter(p => p.fee && !isBoot(p.name)).map(p => p.name).join(" and ")}, ask what they paid to get in that day (once per day) and add it as an expense called "Entry fee: <place>".`:""}\n`:(S.places||[]).some(p => p.fee && !isBoot(p.name))?`2. For ${(S.places||[]).filter(p => p.fee && !isBoot(p.name)).map(p => p.name).join(" and ")}, ask what they paid to get in that day (once per day) and add it as an expense called "Entry fee: <place>".\n`:""}${!skuOn() ? "3. No SKUs: leave the SKU column empty." : useBox() ? `3. SKU: \`BOX - number\`, e.g. \`${list(S.boxes)[0]} - 4821\`. The user picks the box; you pick a random 4-digit number that has never been used in column K of any tracker, in any box. Use 5 digits when 4-digit numbers run out. A relisted return gets a new SKU.` : "3. SKU: a random 4-digit number (no box) that has never been used in the SKU column of any tracker. Use 5 digits when 4-digit numbers run out. A relisted return gets a new SKU."}
4. Write the listing, each part in its own copy box with nothing extra in it: Title (max 80 characters, brand + model + key spec + colour + extras + status in capitals${S.titleWords?`; words they like: ${S.titleWords}`:""}), Custom label (SKU), Item specifics (table), Condition ("Used" if working, otherwise "For parts or not working"), Condition description, and Description as simple HTML for eBay's HTML tab.
   - Never invent faults or say it works unless it's Tested working.
${S.noPhotosLine?`   - Always include: "Item packed and stored in inventory, so no further photos can be provided."\n`:""}   - Faulty or Untested items: say no returns are accepted.${S.returnsWorking?" Working items: say returns are accepted.":""}
${S.descExtra?`   - Add this line to every description: "${S.descExtra}"\n`:""}5. Add a Listed row: Item, Listed, Cost, Shipping 0, Fees 0, Date Bought, SKU, Bought from.

## Sold
From an order screenshot: match the Listed row by SKU first, then by title. Fill Status Sold, Sold Price (item price only, no postage), Date Sold, and Shipping and Fees only if the seller paid them.${via.length?` Fill Sold on with where it sold (${sells().join(" / ")}).`:""}
Then make a thank-you card as a Google Doc in Google Drive, signed ${seller}${otherNames ? ` (or, when it sold on another site, that site's username: ${otherNames})` : ""}, with the SKU, order number, item, order date, delivery service (usually ${S.postage}) and buyer's name.${S.cardNote?` Use this message at the top: "${S.cardNote}"`:""}

## Returns and refunds
Full return: Status = Returned. Partial refund: add the refund to Fees. Return postage label: add it to Shipping.

## Expenses
Add to the Expenses tab with the right category.${S.carboot?" Carboot entry fees are added automatically on days they bought at a carboot, so never add those. If they went to a carboot and bought nothing, ask whether to add the entry fee as an expense.":""}

## Buyer messages
When they ask for a message to a buyer, use these, filling in {buyer}, {item}, {sku}, {price} and {seller}:

${msgs}

## After any change
Read the row back and tell them in one line what changed and where.
`;
}
