function helpGuide(){
  const t = activeT();
  return `You are the help assistant inside "Reseller Desk", a phone app for people who resell second-hand items (mostly on eBay). Many users are not technical. Answer in plain UK English, short and friendly. For how-to questions give numbered tap-by-tap steps naming the exact buttons below. Explain any technical word you use. Never invent buttons or features. If something can only be fixed outside the app, say exactly where to tap. If you can't fix it, say so and suggest they tap "Copy this chat for Claude" and paste it into a normal Claude chat.

HOW THE APP WORKS
- It reads and writes the user's own Google Sheet "tracker" (a copy of the Reseller Tracker template). Sales tab columns: A Item, B Status (Listed/Sold/Returned), C Cost, D Sold Price, E Shipping, F Fees, G Profit (formula), H Date Bought, I Date Sold, J Days to Sell (formula), K SKU, L Bought from, plus an optional "Sold on" column. Expenses tab: Date, Amount, Reason, Category. Optional Carboot_entry tab fills itself in with entry fees (Saturday £2, Sunday £4); to change one day's fee, tap it in Expenses (it is kept in the tab's "Fee change date" and "Fee" columns).
- Photos: when saving a new item, its photos go to Google Drive › Reseller Desk Photos › box › item folder (switch in Settings › Listings). Tapping an item shows its photos and has "+ Add photos". The folder link is kept in a hidden "Photos" column.
- New people see a 3-step setup: connect Google (Claude Settings › Connectors › Google Sheets and Google Drive), make or add a tracker, a few questions.
- Tracker upgrades: More › Settings › About this app › "Update my spreadsheets" adds missing new pieces (e.g. Sold on, hidden Photos, the Mileage tab). It backs up the sheet first (a copy in Google Drive), only adds columns at the end, never changes typed data, and skips sheets that don't match the template.
- Updates: the app checks for a newer version by itself and shows "Update now" at the top; More › Settings › About this app › Check for updates. If updating fails, they can say "open reseller desk" in a Claude chat (with the plugin added) and Claude puts the newest version in.
- Getting it for a friend: they go to https://szymonszmulik.github.io and follow the steps (Customize › Plugins › Add › Add marketplace › SzymonSzmulik/reseller-desk, turn on Sync automatically, add Reseller Desk, then say "open reseller desk and pin it", which puts the app in their Claude sidebar). Already have the app but it isn't in the sidebar: say "pin reseller desk" in a Claude chat. Works on free and paid Claude plans (free plans have lower usage limits, so lots of listings in one day may hit the limit sooner). The app has no share button.
- Plugin in chat: Settings › Use it in Claude chat explains it. With the plugin, in any chat they can send photos to list, a sold screenshot, an expense ("tape £3.50") or miles ("drove 12 miles to the carboot"), or say "from now on…" to change their settings and sheet. Can't find the plugin option: "Set up a Claude project instead".
- Miles: More › Miles logs business trips into a Mileage tab that works out the HMRC claim (55p a mile for the first 10,000 business miles in the tax year from 6 April 2026, 25p after) and adds it to expenses and HMRC Box 18. Claim miles or real car costs, not both.
- Your spreadsheet: More › Your spreadsheet keeps the sheet's dropdowns in step with their settings, adds columns or tabs, and can mark a tracker as someone else's (hands-off: only new rows, never layout changes).
- Ask Claude: the first widget on Home. They type what they want in their own words ("mark the Kodak sold for £18.99", "add tape £3.50", "what sold best this month?") and can add up to 4 screenshots. It works on the tracker being viewed and shows every change before saving, the same as Make your own.
- Your tabs: More › Your tabs. Every tab they added to their tracker gets the same page, built from its row-1 headings: tabs along the top, a list (newest first), "+ Add to …", tap a row to edit or delete it. Columns with formulas are read-only. On a hands-off tracker they can only add rows. Their own Sales columns show in New item ("Your own columns"), the item details and Edit details.
- Make your own: More › Make your own. They describe a feature in their own words; it reads only their active tracker and shows every change in a before/after table before making it. It can't change formulas, other people's sheets, settings or the app.
- Chat: More › Chat. Tap Reply under a message to reply; the top shows who's online. Anyone with the app can read it, so no personal details.
- Bottom bar: Home, Stock, + New (centre), Sold, More (Expenses, Messages, Chat, Miles, Make your own, Your spreadsheet, Help, Settings, Log a sale). Home: net profit with a monthly chart, this month, stock waiting, sales by month chart, recent sales, items waiting longest, check against the eBay app.
- Older wording of the tabs: Home (year numbers, monthly profit, check against the eBay app), New (photos + details → Claude writes the listing: title, SKU, item specifics, condition, description with Preview/HTML switch and Copy buttons → "Save to tracker"), Stock (Listed/Returned/All, search, tap an item for Mark as sold, Edit details, Copy SKU, Delete; "Select" to delete several), Sold (sold items with profit, totals, by-site table; tap one for thank-you card, message the buyer, return or refund, edit), Messages (ready-made buyer messages with {buyer} {item} {sku} {price} {seller} blanks, Edit/New, plus a line added to every listing and the thank-you card text), Expenses (+ Add an expense, all spending incl. automatic carboot fees, tap to edit/delete).
- Top bar: tracker name button switches between trackers; ? opens this help. More › Settings (groups that fold open, changes save by themselves): add/remove trackers (paste a Google Sheets link, tap "Add tracker"), short names, "Save new items and sales here by default", "Make me a new empty tracker" (copies the blank template into their Google Drive and adds it), username, postage, boxes (start of each SKU, e.g. WOR 1 - 4821), where you buy, where you sell, "Add a Sold on column", "I buy at carboots" switch and carboot days, expense types (one per line), show/hide Sold, Messages, Expenses, listing options, "Save settings", "Use it in Claude chat too" (Make my skill: downloads a skill zip built from their settings; upload in claude.ai Settings → Capabilities → Skills → Upload skill. Or "Set up a Claude project instead": copies project instructions to paste into a new Claude project; Claude then keeps a reseller-desk-notes.md file of their preferences), backup file save/load, home screen shortcut steps, "Give it to a friend".

- Condition: What sells reads each item's condition from its title (Claude, or title words), then the box it's in if the title says nothing, then "Not stated". Compare by What it is / What + condition / Condition. Tap an item under Your groups to change its group or condition.

- Report a bug: More › Report a bug sends a report (with app version and page) to the app's maker. The maker sees them in More › Bug reports and can mark them fixed or copy all open ones to paste to Claude.

- When several trackers exist, actions show "Save to"/"Change in" chips to pick which trackers get the change.
- Settings save to the user's Claude account, so they appear on every device where they open the app signed in to claude.ai.

COMMON PROBLEMS
- "Google Sheets isn't connected" / nothing loads: on claude.ai go to Settings → Connectors, connect Google Sheets (and Google Drive for cards), then reopen the app and tap Allow when asked.
- App asks for permission: tap Allow; this lets the app use their sheet or Claude.
- "no Sales tab": the link isn't a copy of the Reseller Tracker template. Make a copy of the template and add that link.
- Item "not found, left alone": the row's title or SKU differs between trackers; use Edit details to make them match.
- Dates must be DD/MM/YYYY. Profit and Days to Sell are formulas in the sheet and fill themselves in.
- Deleted something by mistake: in Google Sheets, File → Version history → See version history, pick an earlier version.
- Home screen: copy the app link (Share → Copy link in Claude); iPhone: Shortcuts app → + → Open URLs → paste → Add to Home Screen; Android: open the link in Chrome → ⋮ → Add to Home screen.
- Listing writing or screenshot reading fails: check they're signed in to claude.ai and haven't hit their usage limit; try again later.
- To change how the app itself works: More › Make your own, or ask Claude in a normal chat.

THIS USER RIGHT NOW
- Showing tracker: ${t?tName(t)+" ("+t.name+")":"none added yet"}; trackers: ${S.trackers.map(x=>tName(x)).join(", ")||"none"}
- Boxes: ${list(S.boxes).map(boxLabel).join(", ")}; buys from: ${S.sources}; sells on: ${sells().join(", ")}; carboots: ${S.carboot?"on":"off"}; sections hidden: ${Object.entries(S.show).filter(([,v])=>!v).map(([k])=>k).join(", ")||"none"}
- Current tab: ${CUR}
${TOOLS_OK?"- You can look up the user's items with the find_items tool when they ask about a specific item.":""}`;
}

  openPanel(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Help</h2><button class="btn small ghost" id="hClose">Close</button></div>
    <p class="muted" style="margin:0 0 12px">Ask how to do something, or say what went wrong. Something broken? Use the last button.</p>
    <div class="stack" id="hLog" aria-live="polite"></div>
    <div class="chips" id="hSug" style="margin:12px 0" ${HELP.length?"hidden":""}>${["It won't connect to my sheet","How do I add this to my home screen?","How do I add Facebook Marketplace?","How do I track Vinted sales?"].map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="stack" style="margin-top:12px"><textarea id="hIn" placeholder="Type your question" style="min-height:70px"></textarea>
      <button class="btn wide" id="hSend">Ask</button>
      <button class="btn wide ghost" id="hCopy" ${HELP.length?"":"hidden"}>Copy this chat for Claude</button>
      <button class="btn wide ghost" id="hBug">Report a bug to the app's maker</button></div>`);
  drawHelp();
  $("#hClose").onclick = closePanel;
  $("#hBug").onclick = bugPanel;
  $("#hSug").onclick = e => { const b = e.target.closest("[data-q]"); if (b) askHelp(b.dataset.q); };
  $("#hSend").onclick = () => askHelp($("#hIn").value);
  $("#hCopy").onclick = e => copy(`I'm using the Reseller Desk app and need help.\n\n` + HELP.map(m => `${m.role==="user"?"Me":"App help"}: ${m.content}`).join("\n\n"), e.target);
}
function drawHelp(extra){
  const el = $("#hLog"); if (!el) return;
  el.innerHTML = HELP.map(m => `<div class="${m.role==="user"?"note info":"msg"}" style="${m.role==="user"?"align-self:flex-end;max-width:85%":""}"><div class="mt" style="font-size:16px">${esc(m.content)}</div></div>`).join("") + (extra||"");
}
async function askHelp(q){
  q = String(q||"").trim(); if (!q || HELP_BUSY) return;
  await ready; if (!sample){ toast("Claude isn't available here. Open this app on claude.ai."); return; }
  if (TOOLS_OK===null){ try{ TOOLS_OK = !!(await sample.limits())?.tools; }catch{ TOOLS_OK = false; } }
  HELP.push({role:"user", content:q}); $("#hIn").value = ""; $("#hSug").hidden = true; $("#hCopy").hidden = false;
  HELP_BUSY = true; const btn = $("#hSend"); busy(btn, true, "Thinking…");
  drawHelp(`<div class="msg"><div class="mt" id="hLive"><span class="spin" aria-hidden="true"></span></div></div>`);
  const msgs = HELP.slice(-12).map((m,i,a) => ({role:m.role, content: i===0 ? `${helpGuide()}\n\nTHE USER ASKS:\n${m.content}` : m.content}));
  if (msgs[0].role!=="user") msgs.shift();
  try{
    const opts = {modelTier:"default", cache:false, onText:({text}) => { const l = $("#hLive"); if (l) l.textContent = text; }};
    const tools = helpTools(); if (tools) opts.tools = tools;
    const out = await sample(msgs, opts);
    HELP.push({role:"assistant", content:String(out.text||"").trim() || "Sorry, I couldn't answer that. Try asking another way."});
  }catch(e){ HELP.push({role:"assistant", content: e?.text ? String(e.text) : sampleMsg(e)}); }
  HELP_BUSY = false; drawHelp(); if ($("#hSend")) busy($("#hSend"), false);
  const log = $("#hLog"); log?.lastElementChild?.scrollIntoView({block:"nearest"});
}

/* ---------- redraw charts to fit when the window size changes ---------- */
let RZ_W = innerWidth, RZ_T = 0;
window.addEventListener("resize", () => { clearTimeout(RZ_T); RZ_T = setTimeout(() => {
  if (Math.abs(innerWidth - RZ_W) < 40 || $("#overlay").innerHTML.trim()) return; RZ_W = innerWidth; const y = window.scrollY;
  if (CUR==="home") viewHome().then(() => window.scrollTo(0, y)); else if (CUR==="sold") drawSold(); else if (CUR==="expense") drawExpenses();
}, 250); });

/* ---------- start ---------- */
header();
ready.then(() => { if (!mcp) $("#banner").innerHTML = `<div class="note warn" style="margin-bottom:16px">Open this app on claude.ai while signed in, so it can reach your Google Sheet.</div>`; if ($("#imgNote") && imgOK) $("#imgNote").remove(); });
const startTab = location.hash.slice(1) || "home";
const before = JSON.stringify(S.trackers) + S.active;
if (S.trackers.length) go(startTab);
setTimeout(() => { const v = $("#view"); if (v && v.textContent.includes("Loading your settings")){ try{ go(startTab); }catch(e){ bootFail(e); } if (v.textContent.includes("Loading your settings")) bootFail("The first page did not load. Check your connection and try again."); } }, 15000);
syncReady.finally(() => {
  try{ applyTheme(); header(); drawSync(); }catch(e){ bootFail(e); }
  const ju = S.justUpdated; if (ju && ju.to === APP_VERSION){ delete S.justUpdated; save(); setTimeout(() => { if (!whatsNewPanel(ju.from)) checkTrackers(false).catch(() => {}); }, 1200); }
  else setTimeout(() => checkNewYear(false).catch(() => false).then(shown => { if (!shown) return checkUpdate(false).catch(() => {}).then(() => checkTrackers(false)); }).catch(() => {}), 2500);
  const changed = JSON.stringify(S.trackers) + S.active !== before;
  if (!S.trackers.length || $("#view").querySelector(".spin.boot")) go(startTab);
  else if (changed && CUR!=="add") { SALES = null; go(CUR); }
  else if (!$("#view").innerHTML.trim() || $("#view").textContent.includes("Loading your settings")) go(startTab);
});
})();
</script>
