<title>Reseller Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone = one column + flat bottom bar with a yellow "New" sticker; desktop (≥1000px) = left sidebar + wide two-column content.
   Look: a reseller's stockroom ledger. Paper-white and ink, ruled lines instead of floating cards, price-sticker yellow used only for "new" and highlights, condensed label type, mono for money and SKUs. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --sunk:#ECECE8; --raised:#FFFFFF; --line:#DEDED8; --rule:#161616;
  --fg:#161616; --muted:#66665F; --faint:#93938B;
  --accent:#161616; --accent-ink:#FFFFFF; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#FFF4C2;
  --listed:#2B5CB8; --listed-bg:#E5ECF8; --sold:#1E7440; --sold-bg:#E1F1E6; --ret:#BF3A2B; --ret-bg:#F8E4E1;
  --warn:#7A5300; --warn-bg:#FFF1C9;
  --chart:#161616; --chart-neg:#BF3A2B; --grid:#E6E6E0;
  --pv-bg:#FFFFFF; --pv-fg:#111111;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px; --r-sm:6px;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1A1A19; --sunk:#242422; --raised:#1F1F1E; --line:#2E2E2B; --rule:#EDEDE8;
  --fg:#EDEDE8; --muted:#A0A098; --faint:#74746D;
  --accent:#EDEDE8; --accent-ink:#111111; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#3A3315;
  --listed:#8FB1F2; --listed-bg:#1C2638; --sold:#7DD39C; --sold-bg:#17291E; --ret:#F2958A; --ret-bg:#351C19;
  --warn:#F2CB6B; --warn-bg:#352C12;
  --chart:#EDEDE8; --chart-neg:#F2958A; --grid:#2A2A27;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1A1A19; --sunk:#242422; --raised:#1F1F1E; --line:#2E2E2B; --rule:#EDEDE8;
  --fg:#EDEDE8; --muted:#A0A098; --faint:#74746D;
  --accent:#EDEDE8; --accent-ink:#111111; --hl:#FFD43B; --hl-ink:#161616; --accent-soft:#3A3315;
  --listed:#8FB1F2; --listed-bg:#1C2638; --sold:#7DD39C; --sold-bg:#17291E; --ret:#F2958A; --ret-bg:#351C19;
  --warn:#F2CB6B; --warn-bg:#352C12;
  --chart:#EDEDE8; --chart-neg:#F2958A; --grid:#2A2A27;
  --shadow:0 12px 32px -12px rgb(0 0 0 / .7);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--hl);color:var(--hl-ink);font-family:var(--display);font-weight:900;font-size:18px;position:relative;flex:none}
.tag::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--hl-ink)}
.topbtns{display:flex;gap:6px;align-items:center;min-width:0}
.switch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 10px 7px 12px;font-weight:600;font-size:14px;min-height:38px;max-width:44vw;min-width:0}
.switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch svg,.gear svg{width:18px;height:18px;flex:none}
.gear{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);width:38px;height:38px;display:grid;place-items:center;flex:none}
a.gear{text-decoration:none}
@media (max-width:420px){.brand .nm{display:none}}

h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:34px;line-height:1.05;margin:14px 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:700;font-stretch:88%;font-size:19px;margin:28px 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
a{color:var(--fg);text-decoration-thickness:1px;text-underline-offset:3px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px}
label.f small,.lab small{font-weight:400;color:var(--muted);font-size:13.5px}
.lab{font-weight:600;margin-bottom:8px;font-size:14.5px}
input[type=text],input[type=number],input[type=url],textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--fg);outline-offset:-1px;border-color:var(--fg)}
button:focus-visible,.chip:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.money{position:relative}.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-family:var(--mono)}.money input{padding-left:28px;font-family:var(--mono)}
.ck{display:flex;gap:12px;align-items:center;font-weight:500}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--fg)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);border-radius:var(--r);padding:13px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);min-height:50px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{background:var(--ret);border-color:var(--ret);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14.5px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:11px 4px;font-weight:600;font-size:14.5px;min-height:46px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tog{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.tog button{border:0;background:var(--surface);color:var(--muted);padding:5px 10px;font-weight:600;font-size:13px}
.tog button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* status */
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill.Listed{background:var(--listed-bg);color:var(--listed)}.pill.Sold{background:var(--sold-bg);color:var(--sold)}.pill.Returned{background:var(--ret-bg);color:var(--ret)}
.sku{font-family:var(--mono);font-size:12.5px;background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:1px 6px;white-space:nowrap;font-weight:500}
.note{border-radius:var(--r-sm);padding:12px 14px;font-size:15px;border-left:3px solid currentColor}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.ok{background:var(--sold-bg);color:var(--sold)}.note.err{background:var(--ret-bg);color:var(--ret)}.note.info{background:var(--sunk);color:var(--fg)}
.pos{color:var(--sold)}.neg{color:var(--ret)}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--hl);color:var(--hl-ink)}

/* numbers */
.hero{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rule);border-radius:var(--r);padding:18px 18px 10px}
.hero .lbl,.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:50px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}
.hero .sub{color:var(--muted);font-size:14px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.kpi{padding:13px 15px;min-width:0;background:var(--surface)}
.kpi .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .val{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em}
.kpi .hint{font-size:13px;color:var(--muted)}
.check{width:100%;border-collapse:collapse;font-size:15px}
.check td,.check th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.check td:not(:first-child){font-family:var(--mono)}
.check tr:last-child td{border-bottom:0}
.check th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* charts */
.chart{position:relative;overflow:hidden;padding-top:30px;margin-top:-22px}
.chart svg{display:block;width:100%;height:auto;overflow:hidden;max-width:100%}
.chart .tip{position:absolute;top:0;z-index:2;transform:translate(-50%,-112%);max-width:70%;overflow:hidden;text-overflow:ellipsis;background:var(--hl);color:var(--hl-ink);font-family:var(--mono);font-size:12.5px;font-weight:500;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 8px;overflow:hidden}
.ccard .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.ccard .ch b{font-family:var(--display);font-weight:700;font-stretch:88%;font-size:16px}
.ccard .ch span{color:var(--muted);font-size:13px;font-family:var(--mono)}
.cap{font-size:13.5px;color:var(--muted);margin:4px 2px 6px;line-height:1.4}
.chart text.vl{fill:var(--fg);font-size:9.5px;font-weight:500}
.sub2{color:var(--muted);font-size:14px;margin:-4px 2px 8px;line-height:1.4}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14.5px;padding-bottom:6px}
.hbar .tr{grid-column:1 / -1;height:8px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:8px}
.hbar .tr i{display:block;height:100%;background:var(--chart);border-radius:2px}
.hbar .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* lists: ruled ledger rows */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;color:inherit;border-radius:0}
.item:hover{background:var(--sunk)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.item .price{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.picked{background:var(--accent-soft)}
.tick{flex:none;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--faint);display:grid;place-items:center;margin-top:2px;background:var(--surface)}
.item.picked .tick{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;padding:0 2px 6px;border-bottom:2px solid var(--rule)}
.boxhead b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:17px;letter-spacing:.02em}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.listcard .item:last-child{border-bottom:0}

/* listing output */
.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.field .fh b{font-size:14px}.field .fh small{color:var(--muted);font-size:12.5px;display:block;font-weight:400}
.field textarea,.field input{border:0;border-radius:0;background:var(--surface)}
.field table{width:100%;border-collapse:collapse;font-size:14.5px}.field td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:top}.field tr:first-child td{border-top:0}.field td:first-child{color:var(--muted);width:42%}
.pv{background:var(--pv-bg);color:var(--pv-fg);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45;padding:14px 16px;overflow-wrap:anywhere;max-height:520px;overflow:auto}
.pv h1,.pv h2,.pv h3{font-family:Arial,Helvetica,sans-serif;font-size:19px;margin:12px 0 6px;color:var(--pv-fg);font-stretch:100%}
.pv p{margin:0 0 10px}.pv ul{margin:0 0 10px;padding-left:22px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.drop{border:1.5px dashed var(--faint);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop:hover{border-color:var(--fg)}
.drop strong{display:block;font-size:16px}

/* photos */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery button{flex:none;border:1px solid var(--line);padding:0;background:var(--sunk);border-radius:var(--r-sm);overflow:hidden;width:120px;height:120px;scroll-snap-align:start}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .ph{width:120px;height:120px;border-radius:var(--r-sm);flex:none;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.viewer{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.viewer img{max-width:100%;max-height:86vh;border-radius:6px}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#fff;color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:700}

/* nav: flat bar on phones, sidebar on desktop */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs .side-brand{display:none}
nav.tabs button{background:none;border:0;color:var(--faint);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;min-height:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"]::after{content:"";width:18px;height:2px;background:var(--fg);border-radius:2px;margin-top:1px}
nav.tabs button.fab span{width:46px;height:40px;border-radius:7px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;position:relative}
nav.tabs button.fab span::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--hl-ink)}
nav.tabs button.fab svg{width:22px;height:22px}
nav.tabs button.fab em{font-style:normal;color:var(--muted)}
nav.tabs button.fab[aria-current="page"]::after{display:none}

/* panels */
.sheet-panel{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet-panel .pane{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:12px 12px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
.sheet-panel .pane::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
@keyframes up{from{transform:translateY(24px)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:var(--r);font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.selbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:8px 10px 8px 14px}
#view.enter{animation:rise .2s ease-out}
@keyframes rise{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#view.enter,.sheet-panel,.sheet-panel .pane{animation:none}.gallery .ph{animation:none}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* settings groups */
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.grp>summary{list-style:none;cursor:pointer;padding:15px 16px;font-family:var(--display);font-weight:700;font-stretch:88%;font-size:16.5px;display:flex;justify-content:space-between;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";font-family:var(--mono);font-size:18px;color:var(--muted)}
details.grp[open]>summary::after{content:"−"}
details.grp>.stack{padding:0 16px 16px}
details.grp>summary>span{display:flex;flex-direction:column;min-width:0}
details.grp .gh{font-family:var(--body);font-weight:400;font-stretch:100%;font-size:13.5px;color:var(--muted);margin-top:1px}
.setsec{margin-top:26px}.setsec:first-of-type{margin-top:6px}
.setsec-h{display:flex;flex-direction:column;padding:0 2px 8px;margin-bottom:10px;border-bottom:2px solid var(--rule)}
.setsec-h b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.setsec-h span{color:var(--muted);font-size:14px}.setsec-h span:empty{display:none}
details.grp .card,details.grp .tcard{background:var(--sunk);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.tile{background:var(--surface);border:0;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px;color:var(--fg)}
.stack>.tile{border:1px solid var(--line);border-radius:var(--r)}
.tile:hover{background:var(--sunk)}
.tile svg{width:24px;height:24px}
.tile b{font-family:var(--display);font-weight:700;font-stretch:88%;font-size:17px}
.tile span{color:var(--muted);font-size:13.5px;line-height:1.35}

.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px}.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:4px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--mono)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.msg .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg .mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.msg .ph{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:13px}
.tcard{background:var(--sunk);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard .tn{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.sync{display:flex;gap:10px;align-items:flex-start}
.sync .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none;background:var(--muted)}
.sync .dot.on{background:var(--sold)}.sync .dot.off{background:var(--warn)}
#fsBtn{display:none}

/* ---------- widgets (iPhone style) ---------- */
.wbhost{grid-column:1 / -1;min-width:0;overflow-anchor:none}
.wb{display:grid;grid-auto-flow:row dense;gap:var(--g)}
.wd{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;color:var(--fg)}
.wd-in{height:100%;display:flex;flex-direction:column;overflow:hidden;min-width:0;border-radius:6px}
.wd.tap{cursor:pointer}
.wd.tap:not(.wfloat):hover{border-color:var(--faint)}
.wd.tap:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;flex:none}
.wh>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wh em{font-style:normal;font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0;font-size:12px;white-space:nowrap}
.wbig{font-family:var(--display);font-weight:800;font-stretch:80%;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.wmeta{font-size:13px;color:var(--muted);line-height:1.3;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:none}
.wsub{font-size:14px;color:var(--muted);margin:6px 0 0;line-height:1.35;flex:none}
.wgrow{flex:1 1 0;min-height:4px}
.wcap{margin:2px 0 0!important;font-size:12.5px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd .chart{margin-top:0;padding-top:6px;flex:none}
.wd .chart .tip{transform:translate(-50%,-115%)}
.wd .spark{display:block;max-width:100%;flex:none}
.wk{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1 1 auto;margin-top:6px;min-height:0;grid-auto-rows:1fr}
.wd-in>.wk:first-child{margin-top:0}
.wk>div{background:var(--surface);padding:7px 9px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.wk span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk b{font-family:var(--mono);font-weight:500;font-size:16.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wk i{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:flex;flex-direction:column;margin-top:4px;min-height:0}
.wr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:5px 0;height:46px;width:100%;color:inherit}
.wl .wr:last-child{border-bottom:0}
.wr .wt{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .wv{font-family:var(--mono);font-size:14px;white-space:nowrap}
.wr .wm{grid-column:1 / -1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .wm .sku{font-size:11px;padding:0 4px}
.wr1{display:block;height:auto;border:0;padding:0;margin-top:4px}
.wt2{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wempty{margin:8px 0 0;font-size:14px}
.wsec{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:10px;flex:none}
.wsel{width:auto!important;padding:3px 24px 3px 10px!important;font-size:13px!important;font-weight:700;border-radius:999px!important;text-transform:none;letter-spacing:0;color:var(--fg);flex:none}
.wlink{border:0;background:none;color:var(--fg);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.wtab{font-size:14px;margin-top:2px}.wtab td,.wtab th{padding:6px 2px}.wtab.tight td,.wtab.tight th{padding:3px 2px;font-size:13.5px}.wtab.tight th{font-size:11px}
.wd .hbar{margin-top:6px;font-size:14px}
.wshort,.wtile{height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.wshort.m,.wtile.m{flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}
.wshort b,.wtile b{display:block;font-family:var(--display);font-weight:700;font-stretch:88%;font-size:18px;line-height:1.15}
.wshort span:not(.wico),.wtile span:not(.wico){display:block;font-size:13.5px;color:var(--muted);line-height:1.3;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--hl);color:var(--hl-ink);flex:none}
.wico svg{width:22px;height:22px}
.wfoot{display:flex;justify-content:center;margin-top:14px}
.wsplit{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:18px;height:100%;align-items:end}.wsplit>div{min-width:0}
.wedit{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.wtool{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding:8px 0 10px;margin-bottom:4px}
.wtool .muted{font-size:13.5px}
@keyframes wjig{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
@keyframes wjig2{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.35deg)}}
.wb.editing .wd{touch-action:pan-y;cursor:grab}
.wb.editing .wd>.wd-in{pointer-events:none}
.wb.editing .wd{animation:wjig .3s ease-in-out infinite;transform-origin:50% 50%}
.wb.editing .wd:nth-child(even){animation-delay:-.15s}
.wb.editing .wd.sz-l,.wb.editing .wd.sz-xl,.wb.editing .wd.sz-m{animation-name:wjig2}
.wb.editing .wd.wph{animation:none}
.wd.wph{background:transparent;border:2px dashed var(--faint);box-shadow:none}
.wd.wph>*{visibility:hidden}
.wd.wfloat{box-shadow:0 18px 40px -10px rgb(0 0 0 / .35);transform:scale(1.04);cursor:grabbing;animation:none!important;pointer-events:none}
.wd.wfloat .wx,.wd.wfloat .wsz{display:none}
body.wdragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.wx{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);background:#8E8E93;color:#fff;font-size:20px;line-height:1;font-weight:700;display:grid;place-items:center;padding:0 0 2px;z-index:2}
.wsz{position:absolute;top:-10px;right:-8px;border:2px solid var(--bg);background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:3px 10px;min-height:28px;font-size:12.5px;font-weight:700;z-index:2;box-shadow:0 2px 6px rgb(0 0 0 / .15)}
@media (prefers-reduced-motion: reduce){.wb.editing .wd{animation:none}}

/* ---------- match your spreadsheet ---------- */
.mq{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-size:15px}
.mqs{font-size:13.5px;margin-top:4px}

.mqgrid select,.mq select{padding:8px 10px;font-size:15px}
.mcols{display:flex;flex-direction:column;gap:8px}
.mcol{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:grid;gap:6px}
.mcol.flag{border-color:var(--hl);box-shadow:inset 3px 0 0 var(--hl)}
.mch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}.mch b{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:4px;padding:1px 6px}
.mcs{font-size:13px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.newdot{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 4px;margin-left:2px;vertical-align:1px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column}
.chatlist{height:calc(100dvh - 370px);min-height:280px;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.cm{max-width:82%;align-self:flex-start;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cm.me{align-self:flex-end;align-items:flex-end}
.cn{font-size:12px;font-weight:700;color:var(--muted);margin:8px 6px 2px}

.conl{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg);padding:2px 2px 8px;font:inherit;font-size:14.5px;text-align:left;cursor:pointer;min-height:32px}
.odot{width:9px;height:9px;border-radius:50%;background:var(--sold);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sold) 22%,transparent)}.odot.off{background:var(--faint);box-shadow:none}

.cq b{display:block;font-size:12px}
.cr{font-size:11px;padding:0;min-height:0}
.cm.flash .cb{outline:3px solid var(--accent);outline-offset:2px}

<script>
(() => {
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GS = "Google Sheets", GD = "Google Drive";

function migrate(o){

    o.trackers = [];
    if (o.trackerId) o.trackers.push({id:o.trackerId, name:o.trackerName||"My tracker", label:"Mine", def:true});
    if (o.partnerOn && o.partnerId) o.trackers.push({id:o.partnerId, name:o.partnerName||"Second tracker", label:"Partner", def:true});
    o.active = o.trackerId || "";
  }
  ["trackerId","trackerName","partnerId","partnerName","partnerOn"].forEach(k => delete o[k]);
  const s = {...DEFAULTS, ...o};
  s.trackers = s.trackers.filter(t => t && t.id).map(t => ({...t, id:t.id, name:t.name||"Tracker", label:t.label||"", def:t.def!==false}));
  if (!Array.isArray(s.custom)) s.custom = [];
  if (!Array.isArray(s.messages)) s.messages = DEFAULT_MSGS.map(m => ({...m}));
  if (!Array.isArray(s.cats) || !s.cats.length) s.cats = CATS.slice();
  s.show = {...SHOW_DEF, ...(s.show||{})}; s.carboot = s.carboot !== false; s.askFee = s.askFee !== false; migratePlaces(s); if (!s.layout || typeof s.layout!=="object" || Array.isArray(s.layout) || s.layoutV !== 2){ s.layout = {}; s.layoutV = 2; }
  if (!s.trackers.some(t => t.id===s.active)) s.active = s.trackers[0]?.id || "";
  return s;
}

/* read a date written almost any way; df = "dmy" or "mdy" for 03/04/2026 style */
function anyDate(v, df="dmy"){
  const s = String(v ?? "").trim(); if (!s) return null; let m;
  const fix = y => (y < 100 ? 2000 + y : y);
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s))){ const a = +m[1], b = +m[2], y = fix(+m[3]); const [d, mo] = df==="mdy" ? [b, a] : [a, b]; return (mo>=1 && mo<=12 && d>=1 && d<=31) ? new Date(y, mo-1, d) : null; }
  if ((m = /^(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([a-z]{3,9})\.?[\s,\-]+(\d{2,4})$/i.exec(s)) && MONTH_N[m[2].slice(0,3).toLowerCase()] !== undefined) return new Date(fix(+m[3]), MONTH_N[m[2].slice(0,3).toLowerCase()], +m[1]);
  if ((m = /^([a-z]{3,9})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{2,4})$/i.exec(s)) && MONTH_N[m[1].slice(0,3).toLowerCase()] !== undefined) return new Date(fix(+m[3]), MONTH_N[m[1].slice(0,3).toLowerCase()], +m[2]);
  if (/^\d{5}(\.\d+)?$/.test(s)){ const n = +s; if (n > 20000 && n < 80000){ const d = new Date(Date.UTC(1899,11,30) + Math.floor(n)*86400000); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); } }
  return null;
}
const ukStr = d => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
const normDate = (v, df) => { const d = anyDate(v, df); return d ? ukStr(d) : String(v ?? "").trim(); };
function normStatus(v, row, has){
  const s = String(v ?? "").trim().toLowerCase();
  if (has && s){
    if (/return|refund/.test(s)) return "Returned";
    if (/^(sold|yes|y|done|complete|completed|true|✓|✔|x|shipped|posted|paid)$/.test(s) || /\bsold\b/.test(s) && !/unsold|not\s*sold/.test(s)) return "Sold";
    if (/^(listed|no|n|active|available|for sale|unsold|not sold|false|in stock|live|stock|pending|draft)$/.test(s)) return "Listed";
  }
  return (num(row[3]) > 0 || String(row[8]||"").trim()) ? "Sold" : "Listed";
}
/* one of their rows -> template order */
function normRow(t, r){
  const m = shp(t); if (!m) return r; const c = m.s.c, df = m.df || "dmy";
  const o = c.map(j => j >= 0 ? (r[j] ?? "") : "");
  o[7] = normDate(o[7], df); o[8] = normDate(o[8], df);
  if (c[1] >= 0 && m.sw){ const s = String(o[1]).trim().toLowerCase(); for (const k of ["Sold","Listed","Returned"]) if (m.sw[k] && s === String(m.sw[k]).trim().toLowerCase()){ o[1] = k; break; } }
  if (!["Sold","Listed","Returned"].includes(o[1])) o[1] = normStatus(o[1], o, c[1] >= 0);
  if (c[6] < 0 && num(o[3]) > 0){ const p = num(o[3]) - num(o[2]) - num(o[4]) - num(o[5]); o[6] = gbp(p); }
  if (c[9] < 0){ const a = parseUK(o[7]), b = parseUK(o[8]); o[9] = a && b ? String(Math.max(0, Math.round((b-a)/86400000))) : ""; }

/* cells keyed by template field (0-11), or by 100 + their real column, -> their real columns */
function mapCells(t, cells){
  const m = shp(t), out = {};
  for (const [k, v] of Object.entries(cells)){ const j = +k;
    if (j >= 100){ out[j-100] = v; continue; }
    if (!m){ out[j] = v; continue; }
    const col = m.s.c[j]; if (col == null || col < 0) continue;
    let val = v;
    if (j === 1 && typeof v === "string" && m.sw && m.sw[v]) val = m.sw[v];

}

function isBoot(n){ return /car\s*-?\s*boot/i.test(String(n || "")); }

function placeDefaults(n){ const k = PLACE_SUGGEST.find(([x]) => x.toLowerCase() === String(n).toLowerCase()); return k ? {days:[...(k[1].days||[])], fee:!!k[1].fee} : isBoot(n) ? {days:[6,0], fee:true} : {days:[], fee:false}; }
function syncPlaces(s){

  s.sources = s.places.map(p => p.name).join(", ");

  s.places = src.filter(n => !(isBoot(n) && s.carboot === false)).map(n => isBoot(n) ? {name:n, days:(s.carbootDays || [6,0]).map(Number), fee:s.askFee !== false} : {name:n, days:[], fee:false});

function placeOf(n){ return (S.places || []).find(p => p.name.toLowerCase() === String(n || "").trim().toLowerCase()) || null; }
const dayNames = days => days.length === 7 ? "any day" : days.map(d => DAYS[d]).join(" and ");
function placeDate(p, d){ if (!p || !p.days || !p.days.length || !d) return d; const x = new Date(d); for (let i = 0; i < 7; i++){ if (p.days.includes(x.getDay())) return x; x.setDate(x.getDate()-1); } return d; }

let SALES = null, SALES_AT = 0, SALES_ID = "";
async function loadSales(force){
  const t = activeT(); if (!t) return [];
  if (SALES && !force && SALES_ID===t.id && Date.now()-SALES_AT < 60000) return SALES;
  const raw = await getVals(t.id, sRange(t, "A1", shp(t) ? "ZZ1000" : "Z997")), hr = sHr(t), m = shp(t), head = raw[hr] || [];
  const vc = m ? (m.s.via ?? -1) : viaIndex(head); VIA_COLS[t.id] = vc;
  const pc = m ? (m.s.ph ?? -1) : head.findIndex(x => /^\s*photos?\s*$/i.test(String(x||"")));
  const v = normS(t, raw);
  SALES = v.map((r,i) => ({row:i, item:r[0]||"", status:r[1]||"", cost:r[2]||"", sold:r[3]||"", ship:r[4]||"", fees:r[5]||"", profit:r[6]||"", bought:r[7]||"", soldOn:r[8]||"", days:r[9]||"", sku:r[10]||"", from:r[11]||"", via:vc>=0?((raw[i]||[])[vc]||""):"", photos:pc>=0?((raw[i]||[])[pc]||""):""})).filter(r => r.row > hr && String(r.item).trim());
  SALES_AT = Date.now(); SALES_ID = t.id; learnDays(); return SALES;
}
/* works out which days each place happens from what's actually been bought there. Nobody is asked. */
function learnDays(){
  let ch = false;
  (S.places || []).forEach(p => { if (p.manual) return;
    const same = n => { n = String(n || "").trim().toLowerCase(); return n === p.name.toLowerCase() || (isBoot(p.name) && isBoot(n)); };
    const ds = (SALES || []).filter(r => same(r.from)).map(r => parseUK(r.bought)).filter(Boolean);
    const seen = new Set(ds.map(d => +d)); if (seen.size < 4) return;   // need 4 different buying days first
    const c = [0,0,0,0,0,0,0]; [...seen].forEach(x => c[new Date(x).getDay()]++);
    let days = c.map((n, d) => n >= 2 && n / seen.size >= 0.15 ? d : -1).filter(d => d >= 0);
    if (days.length >= 6 || !days.length) days = [];                   // buys all week: any day
    if (days.join() !== p.days.slice().sort().join()){ p.days = days.sort(); ch = true; } });
  if (ch){ syncPlaces(S); save(); }
}

  const i = H.findIndex(h => /^sold\s*(on|via|at|through|where)$/.test(h)); return i >= 0 ? i : H.findIndex(h => /^(platform|site|marketplace|channel|where\s*sold|sold\s*on\s*site|selling\s*site)$/.test(h)); };

/* press and hold to wiggle; in wiggle mode, hold (touch) or drag (mouse) a widget to move it */

  const page = el.parentElement.dataset.page, editing = WEDIT===page, mouse = e.pointerType==="mouse";
  const st = {x:e.clientX, y:e.clientY, id:e.pointerId, page, elId:el.dataset.id, last:e};
  const begin = () => { WHOLD = null; if (WEDIT!==page){ wEdit(page, st.elId); navigator.vibrate?.(12); } const nel = WB[page].host.querySelector(`.wb>.wd[data-id="${CSS.escape(st.elId)}"]`); if (nel) wStart(nel, st.last); };

function wStart(el, ev){

/* ---- check against each selling app: worked out from the tracker's Sold on column ---- */
const SITE_WHERE = s => /ebay/i.test(s) ? "eBay app › Selling › Sold" : /vinted/i.test(s) ? "Vinted › your profile › Sold items" : /facebook|marketplace/i.test(s) ? "Facebook › Marketplace › Your listings › Sold" : /depop/i.test(s) ? "Depop › Selling › Sold" : /etsy/i.test(s) ? "Etsy › Shop Manager › Orders" : `${s}`;
const isFb = s => /facebook|marketplace|^fb\b/i.test(String(s||"").trim());
/* "FB", "Facebook Marketplace" and "Facebook" are the same site; so are "eBay UK" and "eBay" */
function sameSite(v, site){ v = String(v||"").trim().toLowerCase(); site = String(site||"").trim().toLowerCase(); if (!v || !site) return false; return v===site || v.includes(site) || site.includes(v) || (isFb(v) && isFb(site)); }
/* the sites to check: the ones they sell on, plus any other site found in their Sold on column */
function checkSites(rows){ const list = sells().slice(); rows.forEach(r => { const v = String(r.via||"").trim(); if (v && (r.status==="Sold"||r.status==="Returned") && !list.some(x => sameSite(v, x))) list.push(v); }); return list; }
function siteStats(rows, site, first){
  const now = new Date(), yr = now.getFullYear(), mo = now.getMonth();
  const mine = rows.filter(r => (r.status==="Sold" || r.status==="Returned") && (sameSite(r.via, site) || (first && !String(r.via||"").trim())));
  const when = r => parseUK(r.soldOn), inY = r => { const d = when(r); return d && d.getFullYear()===yr; }, inM = r => { const d = when(r); return d && d.getFullYear()===yr && d.getMonth()===mo; };
  const sold = mine.filter(r => r.status==="Sold").sort((a,b) => (when(b)||0) - (when(a)||0));
  const y = sold.filter(inY), m = sold.filter(inM);
  return {site, yr, y:y.length, ySum:y.reduce((a,r) => a + num(r.sold), 0), m:m.length, mSum:m.reduce((a,r) => a + num(r.sold), 0),
    ret: mine.filter(r => r.status==="Returned" && inY(r)).length, list: sold, noSite: first ? mine.filter(r => !String(r.via||"").trim()).length : 0};
}
function siteWidgets(D){
  const sites = checkSites(D.all), out = {};
  const stats = () => sites.map((x,i) => siteStats(D.all, x, i===0));
  const viaNote = () => !D.hasVia ? `<div class="wmeta">Add a Sold on column (Settings › Selling) so the app knows where each item sold. Until then everything counts as ${esc(sites[0])}.</div>` : "";
  if (sites.length > 1) out.apps = {name:"Check against your apps", desc:"Sales on each site from your tracker, to compare with each app.", sizes:["m","l","w"], render:(z,{h}) => {
    const st = stats(), yr = st[0].yr, noSite = st[0].noSite, fit = wfit(h - (z==="l" ? 130 : 60), 25);
    return wh("Check against your apps", `<em>${yr}</em>`) + `<table class="check wtab tight"><thead><tr><th>Site</th><th>Sold</th><th>Takings</th><th>This month</th>${z==="m"?"":"<th>Returns</th>"}</tr></thead><tbody>${st.slice(0, fit).map(x => `<tr><td style="font-family:var(--body)"><b>${esc(x.site)}</b></td><td>${x.y}</td><td>${gbp(x.ySum)}</td><td>${x.m} · ${gbp(x.mSum)}</td>${z==="m"?"":`<td>${x.ret}</td>`}</tr>`).join("")}</tbody></table>`
      + wgrow + (z==="l" ? `<div class="wmeta" style="-webkit-line-clamp:6">${st.map(x => `${esc(x.site)}: ${esc(SITE_WHERE(x.site))}`).join("<br>")}</div>` : "")
      + (D.hasVia ? `<p class="cap wcap">${[st.length > fit ? `+${st.length-fit} more (make it Large)` : "", noSite ? `${noSite} with no site counted as ${esc(sites[0])}` : ""].filter(Boolean).join(" · ") || "From your tracker. Compare with each app."}</p>` : viaNote()); }};
  sites.forEach((site, i) => {
    out["site_" + site.toLowerCase().replace(/[^a-z0-9]+/g, "_")] = {name:`Check: ${site}`, desc:`Your ${site} sales from the tracker, to compare with the ${site} app.`, sizes:["s","m"], render:(z,{w,h}) => {
      const x = siteStats(D.all, site, i===0);
      if (z==="s") return wh(site) + wgrow + wbig(gbp(x.ySum), w, z) + wmeta(`${x.y} sold in ${x.yr} · ${x.m} this month`);
      if (isFb(site)) return wh(`${site}: tick these off`, `<em>${x.y} in ${x.yr}</em>`) + wrows(x.list, wfit(h - 46, 46), r => wrow(r.row, r.item, r.sold, esc(r.soldOn)), "Nothing marked as sold here yet.") + wgrow + wmeta(`Facebook doesn't show totals. Check them in ${esc(SITE_WHERE(site))}.`);
      return wh(`Check: ${site}`, `<em>${x.yr}</em>`) + wkpis([["Sold", String(x.y)], ["Takings", gbp(x.ySum)], ["This month", `${x.m} · ${gbp(x.mSum)}`], ["Returns", String(x.ret)]], 2) + wmeta(`Compare in ${esc(SITE_WHERE(site))}.${x.noSite?` Includes ${x.noSite} with no site recorded.`:""}`); }};
  });
  return out;
}

const CHAT = {id:null, tab:null, sid:null, rows:[], n:0, timer:0, full:0, busy:false, pending:[], reply:null, online:[], beatAt:0, onSid:null, verified:false};

async function chatFind(){

async function chatTab(){

const chatRow = (r, i) => ({row:i, at:r[0]||"", mid:r[1]||"", from:r[2]||"", name:r[3]||"Someone", text:r[4]||"", del:String(r[5]||"")==="1", re:r[6]||""});

}
function chatUnread(){ const seen = S.chatSeen || ""; return CHAT.rows.filter(m => !m.del && m.from !== chatMe() && m.at > seen && !(S.chatHide||[]).includes(m.from)).length; }
/* one light check when the app opens, for the unread count on the More › Chat tile */
async function chatPeek(){ if (!(await chatFind()) || !S.chatJoined) return; try{ await chatRead(false); const n = chatUnread(); const t = document.querySelector('.wd[data-id="chat"] .wtile b'); if (t) t.innerHTML = `Chat${n ? ` <span class="newdot">${n}</span>` : ""}`; }catch{} }

/* only adds to formulas that look exactly like the template's; anything changed by hand is left alone and reported */

/* ---------- CHARTS: hand-drawn SVG, one series each, tap or hover for the value ---------- */
let CH_ID = 0;
const short = n => { const a = Math.abs(n), s = n<0?"-":""; return a>=1000 ? `${s}£${(a/1000).toFixed(a>=10000?0:1)}k` : `${s}£${Math.round(a)}`; };
function nice(v){ if (v<=0) return 0; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lastMonths(n=12){ const out = [], d = today(); d.setDate(1); for (let i=n-1;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); out.push({y:x.getFullYear(), m:x.getMonth(), label:MONTHS[x.getMonth()]}); } return out; }
const cw = wide => { const v = document.getElementById("view"); const w = Math.max(300, (v && v.clientWidth) || innerWidth); if (innerWidth < 1000) return Math.round(w - 30); return Math.round(wide ? w - 30 : (w - 16) / 2 - 30); };
function frame(vals, H, W=340, T=10){
  const L = 38, R = 6, B = 22, iw = W-L-R, ih = H-T-B;
  const top = nice(Math.max(0, ...vals)) || 1, bot = Math.min(0, ...vals) < 0 ? -nice(-Math.min(...vals)) : 0;
  const y = v => T + (top - v) / (top - bot) * ih;
  const ticks = [top, top/2, 0]; if (bot < 0) ticks.push(bot);
  const grid = ticks.map(v => { const close = v===bot && bot<0 && Math.abs(y(bot)-y(0)) < 14;
    return `<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>${close?"":`<text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${short(v)}</text>`}`; }).join("");
  return {W, H, L, R, T, B, iw, ih, y, grid};
}
function hits(f, n, vals, labels, fmt, xs){
  const bw = f.iw / n;
  return vals.map((v,i) => { const cx = xs ? xs[i] : f.L + bw*i + bw/2; const yp = Math.min(f.y(v), f.y(0)); return `<rect class="hit" x="${(cx-bw/2).toFixed(1)}" y="${f.T}" width="${bw.toFixed(1)}" height="${f.ih}" data-tip="${esc(labels[i])}: ${esc(fmt(v))}" data-x="${(cx/f.W*100).toFixed(1)}" data-y="${(yp/f.H*100).toFixed(1)}"><title>${esc(labels[i])}: ${esc(fmt(v))}</title></rect>`; }).join("");
}
function xLabels(f, labels, xs, every=1){ return labels.map((l,i) => i%every ? "" : `<text x="${xs[i].toFixed(1)}" y="${f.H-6}" text-anchor="middle">${esc(l.slice(0,3))}</text>`).join(""); }
function barChart(vals, labels, o={}){
  const n = vals.length, f = frame(vals, o.h||170, o.w||cw(false), 22), bw = f.iw/n, w = Math.max(4, Math.min(22, bw*.62)), r = Math.min(4, w/2), y0 = f.y(0);
  const xs = vals.map((_,i) => f.L + bw*i + bw/2);
  const bars = vals.map((v,i) => { if (!v) return ""; const x = xs[i]-w/2, yv = f.y(v), hgt = Math.abs(yv-y0); const rr = Math.min(r, hgt);
    const d = v>0 ? `M${x},${y0}V${yv+rr}Q${x},${yv} ${x+rr},${yv}H${x+w-rr}Q${x+w},${yv} ${x+w},${yv+rr}V${y0}Z` : `M${x},${y0}V${yv-rr}Q${x},${yv} ${x+rr},${yv}H${x+w-rr}Q${x+w},${yv} ${x+w},${yv-rr}V${y0}Z`;
    return `<path d="${d}" fill="${v<0?"var(--chart-neg)":"var(--chart)"}" opacity="${o.now===undefined||o.now===i?1:.55}"/>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(o.label||"Bar chart")}">${f.grid}${bars}${o.values===false?"":vals.map((v,i) => v && bw>=22 ? `<text class="vl" x="${xs[i].toFixed(1)}" y="${(v>0 ? f.y(v)-5 : f.y(v)+12).toFixed(1)}" text-anchor="middle">${esc(short(v))}</text>` : "").join("")}${xLabels(f, labels, xs)}${hits(f, n, vals, labels, o.fmt||gbp, xs)}</svg><div class="tip" hidden></div></div>`;
}
function areaChart(vals, labels, o={}){
  const n = vals.length, f = frame(vals, o.h||150, o.w||cw(true), 22), id = "ag"+(++CH_ID);
  const xs = vals.map((_,i) => f.L + (n===1 ? f.iw/2 : f.iw*i/(n-1)));
  const pts = vals.map((v,i) => [xs[i], f.y(v)]);
  const line = pts.map((p,i) => `${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const area = `${line}L${xs[n-1].toFixed(1)},${f.y(0).toFixed(1)}L${xs[0].toFixed(1)},${f.y(0).toFixed(1)}Z`;
  const last = o.now ?? n-1; const lp = pts[last];
  const f2 = {...f, iw: f.iw + f.iw/(n-1||1)};
  return `<div class="chart"><svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(o.label||"Line chart")}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".35"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
    ${f.grid}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${lp?`<circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="4.5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/><text class="vl" x="${lp[0].toFixed(1)}" y="${(lp[1]-10).toFixed(1)}" text-anchor="middle">${esc(short(vals[last]))}</text>`:""}
    ${xLabels(f, labels, xs, n>8 && f.iw/n < 34 ? 2 : 1)}${hits(f2, n, vals, labels, o.fmt||gbp, xs)}</svg><div class="tip" hidden></div></div>`;
}
function chartCard(title, note, chart, cap){ return `<div class="ccard"><div class="ch"><b>${esc(title)}</b>${note?`<span>${note}</span>`:""}</div>${chart}${cap?`<p class="cap">${esc(cap)}</p>`:""}</div>`; }
function hbars(rows, fmt=gbp){
  const max = Math.max(1, ...rows.map(r => Math.abs(r[1])));
  return `<div class="hbar">${rows.map(([k,v]) => `<span style="min-width:0;overflow-wrap:anywhere">${esc(k)}</span><span class="v">${fmt(v)}</span><div class="tr"><i style="width:${Math.max(2, Math.abs(v)/max*100).toFixed(1)}%"></i></div>`).join("")}</div>`;
}
function tipHandler(e){
  const h = e.target.closest && e.target.closest(".chart .hit");
  document.querySelectorAll(".chart .tip").forEach(t => { if (!h || t.parentElement !== h.closest(".chart")) t.hidden = true; });
  if (!h) return; const t = h.closest(".chart").querySelector(".tip");
  const c = h.closest(".chart"), svg = c.querySelector("svg");
  t.textContent = h.dataset.tip; t.style.left = Math.min(80, Math.max(20, +h.dataset.x)) + "%";
  t.style.top = Math.max(30, svg.offsetTop + svg.getBoundingClientRect().height * (+h.dataset.y) / 100) + "px"; t.hidden = false;
}
const hideTips = () => document.querySelectorAll(".chart .tip").forEach(t => t.hidden = true);
window.addEventListener("scroll", hideTips, {passive:true});
document.addEventListener("pointerover", tipHandler); document.addEventListener("click", tipHandler);
/* monthly totals from the Sales rows */
function byMonth(rows, dateKey, valFn, months){
  return months.map(mo => rows.reduce((s,r) => { const d = parseUK(r[dateKey]); return d && d.getFullYear()===mo.y && d.getMonth()===mo.m ? s + valFn(r) : s; }, 0));
}

/* ---------- description preview: only safe, simple tags ---------- */
function cleanHtml(src){
  const root = new DOMParser().parseFromString(String(src||""), "text/html").body;
  const ok = new Set(["P","B","STRONG","I","EM","U","H1","H2","H3","H4","UL","OL","LI","BR","DIV","SPAN","CENTER","FONT"]);
  const drop = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","TEMPLATE","NOSCRIPT"]);
  const walk = n => [...n.childNodes].map(c => {
    if (c.nodeType===3) return esc(c.textContent);
    if (c.nodeType!==1 || drop.has(c.tagName)) return "";
    if (c.tagName==="BR") return "<br>";
    const t = c.tagName.toLowerCase(); return ok.has(c.tagName) ? `<${t}>${walk(c)}</${t}>` : walk(c);
  }).join("");
  return walk(root);
}
function withExtra(html){
  const x = String(S.descExtra||"").trim(); if (!x) return html;
  return html.includes(esc(x)) || html.includes(x) ? html : `${html}\n<p>${esc(x)}</p>`;
}

/* after saving a carboot buy: ask the entry fee for that day, once per day (an answer is kept in Carboot_entry I:J) */
async function askBootFee(targets, d){
  if (!d || !$("#bfAsk")) return;
  const found = [];
  for (const t of targets){
    try{ const v = await getVals(t.id, "Carboot_entry!I1:J400");
      if (!/fee change/i.test(String((v[0]||[])[0]||""))) continue;
      if (v.some((x,k) => k>0 && parseUK(x[0]) && +parseUK(x[0])===+d)) continue;
      found.push({t, v});
    }catch{}
  }
  const box = $("#bfAsk"); if (!found.length || !box) return;
  const usual = d.getDay()===6 ? 2 : d.getDay()===0 ? 4 : 0;
  box.innerHTML = `<div class="card stack" style="margin-top:10px;border-left:3px solid var(--hl)">
    <div><b>What did you pay to get in on ${DAYS[d.getDay()]} ${fmtD(d)}?</b>

    <div class="chips" id="bfChips">${[0,1,2,3,4,6].map(n=>`<button class="chip" data-v="${n}" aria-pressed="${n===usual}">${n?gbp(n):"Free"}</button>`).join("")}</div>
    <label class="f">Or type it<div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" min="0" id="bfAskAmt" value="${usual.toFixed(2)}"></div></label>
    <div id="bfAskMsg"></div>
    <div class="row"><button class="btn small" id="bfAskSave">Save fee</button><button class="btn small ghost" id="bfAskSkip">Skip</button></div></div>`;
  $("#bfChips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
    $("#bfChips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b)); $("#bfAskAmt").value = (+b.dataset.v).toFixed(2); };
  $("#bfAskAmt").oninput = e => { $("#bfChips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", e.target.value!=="" && +x.dataset.v===num(e.target.value))); };
  $("#bfAskSkip").onclick = () => { box.innerHTML = `<div class="note info" style="margin-top:10px">Kept the usual ${gbp(usual)}. You'll be asked again with the next carboot buy for this day, or tap it in Expenses.</div>`; };
  $("#bfAskSave").onclick = async () => { const btn = $("#bfAskSave"), amt = $("#bfAskAmt").value;
    if (amt==="" || num(amt)<0){ $("#bfAskMsg").innerHTML = `<div class="note warn">Type the fee, e.g. 2.00.</div>`; return; }
    busy(btn, true, "Saving…");
    try{
      for (const {t, v} of found){ const sid = await tabId(t.id, "Carboot_entry");
        let last = 0; v.forEach((x,k) => { if (String(x[0]??"").trim()) last = k; });
        await batch(t.id, rowRequests(sid, last+1, {8:{date:serial(d)}, 9:num(amt)})); }
      HOME_C = null;
      box.innerHTML = `<div class="note ok" style="margin-top:10px">Entry fee for ${fmtD(d)} saved as ${gbp(num(amt))}. Change it any time in Expenses.</div>`;
    }catch(e){ busy(btn, false); $("#bfAskMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
}

async function extraRowVals(t, r){
  const cols = await extraCols(t); if (!cols.length || r.row == null) return {cols:[], vals:{}};

  const vals = {}; cols.forEach(c => { vals[xKey(c.name)] = String(raw[c.col] ?? ""); }); return {cols, vals};
}

    const dt = (col, id, old, label) => { const v = $(id).value.trim(); if (v===String(old||"").trim()) return; if (v===""){ cells[col] = null; return; } const d = parseUK(v); if (!d){ bad.push(`${label} as DD/MM/YYYY`); return; } cells[col] = {date:serial(d)}; };

}

function deletePanel(rows){
  if (!rows.length) return;
  const one = rows.length===1;
  openPanel(`<h2 style="margin-top:0">Delete ${one?"this item":`${rows.length} items`}?</h2>
    <p class="muted" style="margin-top:0">This removes the whole row from the sheet. If you change your mind, use File → Version history in Google Sheets.</p>
    <div class="card" style="max-height:200px;overflow:auto;margin-bottom:14px">${rows.map(r=>`<div style="padding:4px 0">${r.sku?`<span class="sku">${esc(r.sku)}</span> `:""}${esc(r.item)}</div>`).join("")}</div>
    <div class="stack">${targetChips("del", [S.active], "Delete from")}
      <div id="dMsg"></div><button class="btn wide danger" id="dGo">Delete</button><button class="btn wide ghost" id="dClose">Cancel</button></div>`);
  bindTargets("del"); $("#dClose").onclick = closePanel;
  $("#dGo").onclick = async () => {
    const btn = $("#dGo"), msg = $("#dMsg"); const targets = readTargets("del", [S.active]);
    if (!targets.length){ msg.innerHTML = `<div class="note warn">Pick at least one tracker.</div>`; return; }
    busy(btn, true, "Deleting…"); const done = [];
    try{
      for (const t of targets){
        const sid = await tabId(t.id, sTab(t)); const v = await salesV(t);
        const idx = new Set(); let missing = 0;
        for (const r of rows){ let i = findRow(v, r, r.status); if (i<0) i = findRow(v, r, ""); if (i>sHr(t) && !idx.has(i)) idx.add(i); else missing++; }
        const order = [...idx].sort((a,b)=>b-a);
        if (order.length) await batch(t.id, order.map(i => ({deleteDimension:{range:{sheetId:sid, dimension:"ROWS", startIndex:i, endIndex:i+1}}})));
        done.push(`${tName(t)}: ${order.length} deleted${missing?`, ${missing} not found`:""}`);
      }
      SALES = null; SELECT = null; drawSelBar();
      msg.innerHTML = `<div class="note ok"><b>Done.</b> ${esc(done.join(" · "))}</div>`; btn.textContent = "Deleted ✓"; btn.disabled = true; toast("Deleted");
      $("#dClose").textContent = "Close"; $("#dClose").onclick = () => { closePanel(); go(CUR); };
      return;
    }catch(e){ msg.innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
    busy(btn, false);
  };
}

let SOLD_RANGE = "month", SOLD_Q = "";
async function viewSold(force){
  const V = $("#view");
  V.innerHTML = `<h1>Sold</h1><p class="lead">Everything you've sold from ${esc(tName(activeT()))}, with the profit on each.</p>
    <div class="stack">${periodPicker("sr", SOLD_RANGE)}

    <div id="soldBody" style="margin-top:16px"><p class="muted"><span class="spin" aria-hidden="true"></span> Loading…</p></div>`;
  bindPeriod("sr", v => { SOLD_RANGE = v; drawSold(); });
  $("#sq").oninput = e => { SOLD_Q = e.target.value; drawSold(); };
  try{ await loadSales(force); if (CUR==="sold") drawSold(); }
  catch(e){ if (CUR==="sold") $("#soldBody").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }

function inRange(d){ return rangeOk(d, SOLD_RANGE); }
function bySite(sold){
  const m = {}; sold.forEach(r => { if (!r.via) return; (m[r.via] ||= {n:0, sales:0, profit:0}); m[r.via].n++; m[r.via].sales += num(r.sold); m[r.via].profit += num(r.profit); });
  const k = Object.keys(m); if (!k.length) return "";
  return `<h2>By site</h2><p class="sub2">Where your sales came from.</p><div class="ccard" style="overflow-x:auto"><table class="check"><thead><tr><th>Site</th><th>Sold</th><th>Sales</th><th>Profit</th></tr></thead><tbody>${k.sort((a,b)=>m[b].profit-m[a].profit).map(s=>`<tr><td><b>${esc(s)}</b></td><td>${m[s].n}</td><td>${gbp(m[s].sales)}</td><td>${gbp(m[s].profit)}</td></tr>`).join("")}</tbody></table></div>`;
}
function drawSold(){
  const el = $("#soldBody"); if (!el) return; const q = SOLD_Q.toLowerCase();
  const rows = (SALES||[]).filter(r => (r.status==="Sold"||r.status==="Returned") && inRange(parseUK(r.soldOn)) && (!q || r.item.toLowerCase().includes(q) || r.sku.toLowerCase().includes(q)))
    .sort((a,b) => (parseUK(b.soldOn)||0) - (parseUK(a.soldOn)||0) || b.row - a.row);
  const sold = rows.filter(r => r.status==="Sold"), ret = rows.filter(r => r.status==="Returned");
  const sales = sold.reduce((s,r)=>s+num(r.sold),0), profit = rows.reduce((s,r)=>s+num(r.profit),0), cost = sold.reduce((s,r)=>s+num(r.cost),0);
  const fees = sold.reduce((s,r)=>s+num(r.fees)+num(r.ship),0);
  const dayVals = sold.map(r=>num(r.days)).filter(x=>x>0); const avgDays = dayVals.length ? Math.round(dayVals.reduce((a,b)=>a+b,0)/dayVals.length) : null;
  const best = sold.slice().sort((a,b)=>num(b.profit)-num(a.profit))[0];
  const sites = {}; sold.forEach(r => { if (!r.via) return; (sites[r.via] ||= {n:0, sales:0, profit:0}); sites[r.via].n++; sites[r.via].sales += num(r.sold); sites[r.via].profit += num(r.profit); });
  const lm = lastMonths(); const X = {range:SOLD_RANGE, profit, sold, ret, sales, cost, fees, avgDays, best, sites, labels: lm.map(x=>x.label), monthly: byMonth((SALES||[]).filter(r => r.status!=="Listed"), "soldOn", r => num(r.profit), lm)};
  el.innerHTML = `<div id="soldBoard"></div>
    <h2>Items sold</h2><p class="sub2">Tap one for details, a thank-you card or a return. The number on the right is the profit.</p>
    <div id="soldList" class="listcard">${rows.length ? rows.map(r=>`<button class="item" data-row="${r.row}"><div style="min-width:0;flex:1"><div class="t">${esc(r.item)}</div>
      <div class="meta">${r.sku?`<span class="sku">${esc(r.sku)}</span>`:""}${r.status==="Returned"?`<span class="pill Returned">Returned</span>`:""}<span>${esc(r.soldOn||"No date")}</span>${r.via?`<span class="pill Listed">${esc(r.via)}</span>`:""}<span>Sold ${esc(r.sold||"-")} · paid ${esc(r.cost||"-")}</span></div></div>
      <div class="price ${num(r.profit)<0?"neg":"pos"}">${esc(r.profit||"-")}</div></button>`).join("") : `<p class="muted">Nothing sold in this period.</p>`}</div>`;
  wBoard($("#soldBoard"), "sold", soldWidgets(X), soldDefault(X));
  $("#soldList").onclick = e => { const b = e.target.closest(".item"); if(!b) return; const r = SALES.find(x => x.row === +b.dataset.row); if (r) itemPanel(r); };

async function saveSold(){
  const btn = $("#sSave"), msg = $("#sMsg"); const row = +$("#sItem").value; const r = (SALES||[]).find(x => x.row===row);
  const price = $("#sPrice").value, d = parseUK($("#sDate").value); const targets = readTargets("sold", defIds());
  if (!r){ msg.innerHTML = `<div class="note warn">Choose which item sold.</div>`; return; }
  if (price===""){ msg.innerHTML = `<div class="note warn">Type what it sold for.</div>`; return; }
  if (!d){ msg.innerHTML = `<div class="note warn">Type the date sold as DD/MM/YYYY.</div>`; return; }
  if (!targets.length){ msg.innerHTML = `<div class="note warn">Pick at least one tracker.</div>`; return; }
  busy(btn, true, "Saving…"); const done = [], noVia = [];
  try{
    for (const t of targets){
      const sid = await tabId(t.id, sTab(t)); const v = await salesV(t);
      const i = findRow(v, r, "Listed");
      if (i<0){ done.push(`${tName(t)}: not found, left alone`); continue; }
      const c = {1:"Sold", 3:num(price), 4:num($("#sShip").value), 5:num($("#sFees").value), 8:{date:serial(d)}};
      const vc = await viaCol(t.id); if (vc>=0 && SOLD_VIA) c[100+vc] = SOLD_VIA; else if (vc<0 && sells().length>1) noVia.push(tName(t));
      await batch(t.id, rowRequests(sid, i, mapCells(t, c)));
      const back = await salesRow(t, i);
      done.push(`${tName(t)}: row ${i+1}, profit ${back[0]?.[6]||"?"}`);

let EXP = {cat:""}, EXP_TAB = "", EXP_RANGE = "year", EXPS = null, BOOTS = null, EMILES = null;
function catMatch(cat, have){
  if (have.includes(cat)) return cat;
  const words = cat.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3);
  let best = null, score = 0;
  for (const h of have){ const s = words.filter(w => h.toLowerCase().includes(w)).length; if (s > score){ score = s; best = h; } }
  return best || cat;
}
async function loadExpenses(){

const FULLM = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function rangeOk(d, range){
  if (range==="all") return true; if (!d) return false; const n = today();
  if (range.startsWith("m:")){ const [y,m] = range.slice(2).split("-").map(Number); return d.getFullYear()===y && d.getMonth()===m; }

/* sub-tabs: All, every expense type (their own ones too), carboot fees, mileage */
const catKey = c => String(c||"").trim().toLowerCase();
function drawExpTabs(exAll, btAll, mlAll){
  const host = $("#expTabs"); if (!host) return;
  const tabs = [["", "All", exAll.reduce((s,r)=>s+num(r.amount),0) + btAll.reduce((s,r)=>s+num(r.fee),0) + mlAll.reduce((s,r)=>s+num(r.claim),0)]];
  const seen = new Set(); const add = (k, n, v) => { if (seen.has(catKey(k))) return; seen.add(catKey(k)); tabs.push([k, n, v]); };
  const sumCat = c => exAll.filter(r => catKey(r.cat) === catKey(c)).reduce((s,r)=>s+num(r.amount),0);
  (S.cats||[]).forEach(c => add(c, c, sumCat(c)));
  exAll.forEach(r => { if (r.cat) add(r.cat, r.cat, sumCat(r.cat)); });
  if (exAll.some(r => !r.cat)) tabs.push(["none", "No type", exAll.filter(r => !r.cat).reduce((s,r)=>s+num(r.amount),0)]);
  if (S.carboot && BOOTS) tabs.push(["boot", "Carboot entry fees", btAll.reduce((s,r)=>s+num(r.fee),0)]);
  if (EMILES) tabs.push(["mile", "Mileage", mlAll.reduce((s,r)=>s+num(r.claim),0)]);
  if (!tabs.some(t => t[0] === EXP_TAB)) EXP_TAB = "";
  host.innerHTML = tabs.map(([k, n, v]) => `<button class="chip" role="tab" data-v="${esc(k)}" aria-pressed="${EXP_TAB===k}" aria-selected="${EXP_TAB===k}">${esc(n)}<em>${gbp(v)}</em></button>`).join("");
  host.onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; EXP_TAB = b.dataset.v; drawExpenses(); };
  const on = host.querySelector('[aria-pressed="true"]'); if (on && on.scrollIntoView) on.scrollIntoView({block:"nearest", inline:"nearest"});
}
function drawExpenses(){
  const el = $("#expBody"); if (!el || !EXPS) return;
  const exAll = EXPS.filter(r => rangeOk(parseUK(r.date), EXP_RANGE));
  const btAll = (BOOTS||[]).filter(r => rangeOk(parseUK(r.date), EXP_RANGE));
  const mlAll = (EMILES||[]).filter(r => rangeOk(parseUK(r.date), EXP_RANGE));
  drawExpTabs(exAll, btAll, mlAll);
  const T = EXP_TAB;
  const ex = T === "" ? exAll : T === "boot" || T === "mile" ? [] : T === "none" ? exAll.filter(r => !r.cat) : exAll.filter(r => catKey(r.cat) === catKey(T));
  const bt = T === "" || T === "boot" ? btAll : [];
  const byCat = {}; ex.forEach(r => { const k = r.cat || "No category"; byCat[k] = (byCat[k]||0) + num(r.amount); });
  const ml = T === "" || T === "mile" ? mlAll : []; const mileTotal = ml.reduce((s,r)=>s+num(r.claim),0);
  const bootTotal = bt.reduce((s,r)=>s+num(r.fee),0); const total = ex.reduce((s,r)=>s+num(r.amount),0) + bootTotal + mileTotal;
  const rows = [...ex.map(r => ({kind:"exp", d:parseUK(r.date), r})), ...bt.map(r => ({kind:"boot", d:parseUK(r.date), r})), ...ml.map(r => ({kind:"mile", d:parseUK(r.date), r}))].sort((a,b) => (b.d||0)-(a.d||0) || (b.r.row||0)-(a.r.row||0));
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); if (S.carboot && BOOTS && bootTotal) catRows.push(["Carboot entry fees", bootTotal]); if (mileTotal) catRows.push(["Mileage", mileTotal]); catRows.sort((a,b)=>b[1]-a[1]);
  const inTab = r => T === "" || (T === "none" ? !r.cat : catKey(r.cat) === catKey(T));
  const lm = lastMonths(); const spend = byMonth(T === "boot" || T === "mile" ? [] : EXPS.filter(inTab), "date", r => num(r.amount), lm).map((v,i) => v + (T === "" || T === "boot" ? byMonth(BOOTS||[], "date", r => num(r.fee), lm)[i] : 0) + (T === "" || T === "mile" ? byMonth(EMILES||[], "date", r => num(r.claim), lm)[i] : 0));
  const Z = {range:EXP_RANGE, total, ex, bt, catRows, spend, lm, bootTotal, hasBoots: !!(S.carboot && BOOTS)};

/* carboot fee for one day: the usual £2/£4, or your own amount kept in Carboot_entry columns I:J */
const OLD_FEE_F = '=ARRAYFORMULA(IF(A2:A="","",IF(WEEKDAY(A2:A,2)=6,2,IF(WEEKDAY(A2:A,2)=7,4,0))))';
const NEW_FEE_F = '=ARRAYFORMULA(IF(A2:A="","",IFERROR(VLOOKUP(A2:A,I2:J,2,FALSE),IF(WEEKDAY(A2:A,2)=6,2,IF(WEEKDAY(A2:A,2)=7,4,0)))))';
async function addFeeCols(t){
  const p = await gs("get_spreadsheet", {spreadsheetId:t.id, includeGridData:true, ranges:["Carboot_entry!E2"], fields:["sheets.properties.sheetId","sheets.properties.gridProperties.columnCount","sheets.data.rowData.values.userEnteredValue"]});
  const sh = p?.sheets?.[0]; const f = String(sh?.data?.[0]?.rowData?.[0]?.values?.[0]?.userEnteredValue?.formulaValue || "");
  if (f.replace(/\s/g,"") !== OLD_FEE_F) throw {code:"tool_error", message:"the Entry fee column in this tracker has been changed by hand, so it was left alone"};
  const ij = await getVals(t.id, "Carboot_entry!I1:J5"); if (ij.some(x => x.some(c => String(c||"").trim()))) throw {code:"tool_error", message:"columns I and J of the Carboot_entry tab already have something in them, so nothing was changed"};
  const sid = sh.properties.sheetId, cols = sh.properties.gridProperties.columnCount; const reqs = [];
  if (cols < 10) reqs.push({appendDimension:{sheetId:sid, dimension:"COLUMNS", length:10-cols}});
  reqs.push({updateCells:{start:{sheetId:sid,rowIndex:0,columnIndex:8}, rows:[{values:[{userEnteredValue:{stringValue:"Fee change date"}},{userEnteredValue:{stringValue:"Fee"}}]}], fields:"userEnteredValue"}},
    {updateCells:{start:{sheetId:sid,rowIndex:1,columnIndex:4}, rows:[{values:[{userEnteredValue:{formulaValue:NEW_FEE_F}}]}], fields:"userEnteredValue"}});
  await batch(t.id, reqs);
}
async function bootFeePanel(b){
  const t = activeT(); const d = parseUK(b.date);
  openPanel(`<h2 style="margin-top:0">Carboot entry fee</h2><p class="muted" style="margin-top:0">${esc(b.day)} ${esc(b.date)} · ${esc(b.items)} item${b.items==="1"?"":"s"} bought for ${esc(b.spent)}</p><div class="stack" id="bfBody"><p class="muted"><span class="spin" aria-hidden="true"></span> Checking…</p></div>`);
  const body = () => $("#bfBody");
  const done = () => { closePanel(); HOME_C = null; if (CUR==="expense") viewExpense(); };
  async function load(){
    try{
      const v = await getVals(t.id, "Carboot_entry!I1:J400"); if (!body()) return;
      if (!/fee change/i.test(String((v[0]||[])[0]||""))){
        body().innerHTML = `<div class="note info">To set your own fee, this tracker needs two small columns added to its Carboot_entry tab. Nothing you've typed changes.</div><div id="bfMsg"></div><button class="btn wide" id="bfAdd">Add them</button><button class="btn wide ghost" id="bfClose">Close</button>`;
        $("#bfClose").onclick = closePanel;
        $("#bfAdd").onclick = async () => { const btn = $("#bfAdd"); busy(btn, true, "Adding…"); try{ await addFeeCols(t); load(); }catch(e){ busy(btn, false); $("#bfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
        return;
      }
      const idx = v.findIndex((x,k) => k>0 && parseUK(x[0]) && d && +parseUK(x[0])===+d);
      const usual = d ? (d.getDay()===6 ? 2 : d.getDay()===0 ? 4 : 0) : 0;
      body().innerHTML = `<label class="f">Fee for this day<div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" min="0" id="bfAmt" value="${num(b.fee).toFixed(2)}"></div></label>
        <p class="muted" style="margin:0;font-size:14.5px">Usually £2 on a Saturday (one carboot) and £4 on a Sunday (two). Change it if you only went to one, or it cost something else.${idx>0?` This day is set by hand; the usual fee would be ${gbp(usual)}.`:""}</p>
        <div id="bfMsg"></div><button class="btn wide" id="bfSave">Save fee</button>
        ${idx>0?`<button class="btn wide ghost" id="bfReset">Go back to the usual ${gbp(usual)}</button>`:""}<button class="btn wide ghost" id="bfClose">Close</button>`;
      $("#bfClose").onclick = closePanel;
      $("#bfSave").onclick = async () => { const btn = $("#bfSave"), amt = $("#bfAmt").value;
        if (amt==="" || num(amt)<0){ $("#bfMsg").innerHTML = `<div class="note warn">Type the fee, e.g. 2.00.</div>`; return; }
        busy(btn, true, "Saving…");
        try{ const sid = await tabId(t.id, "Carboot_entry"); let row = idx;
          if (row<0){ let last = 0; v.forEach((x,k) => { if (String(x[0]??"").trim()) last = k; }); row = last+1; }
          await batch(t.id, rowRequests(sid, row, {8:{date:serial(d)}, 9:num(amt)})); toast(`Fee for ${b.date} set to ${gbp(num(amt))}`); done();
        }catch(e){ busy(btn, false); $("#bfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } };
      $("#bfReset") && ($("#bfReset").onclick = async () => { const btn = $("#bfReset"); busy(btn, true, "Saving…");
        try{ const sid = await tabId(t.id, "Carboot_entry"); await batch(t.id, rowRequests(sid, idx, {8:null, 9:null})); toast(`Back to the usual ${gbp(usual)}`); done(); }
        catch(e){ busy(btn, false); $("#bfMsg").innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; } });
    }catch(e){ if (body()) body().innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
  }
  load();
}
function expensePanel(r){
  const cats = S.cats.slice(); if (r && r.cat && !cats.includes(r.cat)) cats.push(r.cat);
  EXP.cat = r ? r.cat : EXP.cat;
  const ids = r ? [S.active] : defIds();
  openPanel(`<h2 style="margin-top:0">${r?"Edit expense":"Add an expense"}</h2>
    ${!r && S.carboot?`<div class="note info" style="margin-bottom:14px">Carboot entry fees are added automatically on days you bought stock at a carboot. Only add one here if you went and bought nothing. To change a fee (say you only went to one), tap it in the list.</div>`:""}
    <div class="stack">
    <div class="grid2"><label class="f">Amount<div class="money"><span>£</span><input type="number" inputmode="decimal" step="0.01" id="eAmt" value="${r&&r.amount!==""?num(r.amount).toFixed(2):""}"></div></label>
    <label class="f">Date<input type="text" id="eDate" inputmode="numeric" value="${esc(r?r.date:fmtD(today()))}"></label></div>
    <label class="f">What was it?<input type="text" id="eWhy" value="${esc(r?r.reason:"")}" placeholder="e.g. Fragile tape, 6 pack"></label>
    <div><div class="lab">Type <small>Change the list in Settings.</small></div><div class="chips" id="eCat">${cats.map(c=>`<button class="chip" data-v="${esc(c)}" aria-pressed="${EXP.cat===c}">${esc(c)}</button>`).join("")}</div></div>
    ${targetChips("exp", ids, r ? "Change in" : "Add to")}
    <div id="eMsg"></div><button class="btn wide" id="eSave">${r?"Save changes":"Add expense"}</button>
    ${r?`<button class="btn wide ghost" id="eDel" style="color:var(--ret)">Delete expense</button>`:""}
    <button class="btn wide ghost" id="eClose">Close</button></div>`);
  pick("#eCat", v => EXP.cat = v); bindTargets("exp");
  const finish = () => { closePanel(); if (CUR==="expense") viewExpense(); };
  $("#eClose").onclick = closePanel;
  /* find this expense in another tracker by its old date, amount and description */
  const findExp = v => v.findIndex((x,k) => k>0 && num(x[1])===num(r.amount) && String(x[2]||"").trim().toLowerCase()===String(r.reason).trim().toLowerCase() && String(x[0]||"").trim()===String(r.date).trim());
  $("#eSave").onclick = async () => {
    const btn = $("#eSave"), msg = $("#eMsg"); const amt = $("#eAmt").value, d = parseUK($("#eDate").value), why = $("#eWhy").value.trim();
    const miss = []; if (amt==="") miss.push("amount"); if(!d) miss.push("date (DD/MM/YYYY)"); if(!why) miss.push("what it was"); if(!EXP.cat) miss.push("type");
    const targets = readTargets("exp", ids); if (!targets.length) miss.push("which tracker");
    if (miss.length){ msg.innerHTML = `<div class="note warn">Still needed: ${esc(miss.join(", "))}.</div>`; return; }
    busy(btn, true, "Saving…"); const done = [];
    try{
      for (const t of targets){
        const sid = await expTabId(t); const v = await expV(t);
        const have = [...new Set(v.slice(1).map(x=>String(x[3]||"").trim()).filter(Boolean))];
        const cat = catMatch(EXP.cat, have);
        if (r){
          const i = findExp(v); if (i<0){ done.push(`${tName(t)}: not found, left alone`); continue; }
          await batch(t.id, rowRequests(sid, i, mapECells(t, {0:{date:serial(d)}, 1:num(amt), 2:why, 3:cat}))); done.push(`${tName(t)}: row ${i+1}`);
        } else {
          if (v.some((x,k)=>k>0 && num(x[1])===num(amt) && (x[2]||"").trim().toLowerCase()===why.toLowerCase() && parseUK(x[0]) && +parseUK(x[0])===+d)){ done.push(`${tName(t)}: already there`); continue; }
          let last = 0; v.forEach((x,k)=>{ if (String(x[0]??"").trim()||String(x[1]??"").trim()) last = k; }); const row = last+1;
          await batch(t.id, rowRequests(sid, row, mapECells(t, {0:{date:serial(d)}, 1:num(amt), 2:why, 3:cat}))); done.push(`${tName(t)}: row ${row+1}`);
        }
      }
      msg.innerHTML = `<div class="note ok"><b>${r?"Saved":"Added"}.</b> ${esc(done.join(" · "))}</div>`; toast(r?"Expense saved":"Expense added");
      btn.textContent = "Done ✓"; btn.disabled = true; $("#eClose").onclick = finish; return;
    }catch(e){ msg.innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
    busy(btn, false);
  };
  $("#eDel") && ($("#eDel").onclick = async () => {
    const b = $("#eDel"), msg = $("#eMsg");
    if (!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; }
    const targets = readTargets("exp", ids); if (!targets.length){ msg.innerHTML = `<div class="note warn">Pick at least one tracker.</div>`; return; }
    busy(b, true, "Deleting…"); const done = [];
    try{
      for (const t of targets){
        const sid = await expTabId(t); const v = await expV(t);
        const i = findExp(v); if (i<0){ done.push(`${tName(t)}: not found`); continue; }
        await batch(t.id, [{deleteDimension:{range:{sheetId:sid, dimension:"ROWS", startIndex:i, endIndex:i+1}}}]); done.push(`${tName(t)}: deleted`);
      }
      msg.innerHTML = `<div class="note ok"><b>Done.</b> ${esc(done.join(" · "))}</div>`; toast("Expense deleted"); b.remove(); $("#eSave").disabled = true; $("#eClose").onclick = finish; return;
    }catch(e){ msg.innerHTML = `<div class="note err">${esc(mcpMsg(e))}</div>`; }
    busy(b, false);
  });
}

function drawTrackers(){
