async function driveCall(tool, input){ await ready; if (!mcp) throw {code:"capability_disabled"}; const r = await mcp.callTool(GD, tool, input, {cache:false}); return r.payload ?? r; }
/* ---------- PHOTOS: Google Drive › Reseller Desk Photos › box › item, link kept in a hidden "Photos" column ---------- */
const FOLDER = "application/vnd.google-apps.folder";
const qs = v => String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const PHOTO_CACHE = {};
async function dSearch(q){ const p = await driveCall("search_files", {query:q, pageSize:50, excludeContentSnippets:true}); return (p && p.files) || []; }
async function makeFolder(title, parentId){
  let f; try{ f = await driveCall("create_file", {title, contentMimeType:FOLDER, parentId}); }
  catch{ f = await driveCall("create_file", {title, mimeType:FOLDER, parentId}); }
  if (!f || !f.id) throw {code:"tool_error", message:"a photo folder couldn't be made"}; return f.id;
}
async function findFolder(title, parentId, exact=true){
  const t = exact ? `title = '${qs(title)}'` : `title contains '${qs(title)}'`;
  return (await dSearch(`${t} and mimeType = '${FOLDER}' and parentId = '${parentId}' and trashed = false`))[0] || null;
}
async function photoRoot(fresh){
  if (S.photoRoot && !fresh) return S.photoRoot;
  const f = await findFolder("Reseller Desk Photos", "root"); S.photoRoot = f ? f.id : await makeFolder("Reseller Desk Photos", "root"); S.boxFolders = {}; save(); return S.photoRoot;
}
async function boxFolder(box, fresh){
  S.boxFolders = S.boxFolders || {}; if (S.boxFolders[box] && !fresh) return S.boxFolders[box];
  const root = await photoRoot(fresh); const f = await findFolder(box, root);
  S.boxFolders[box] = f ? f.id : await makeFolder(box, root); save(); return S.boxFolders[box];
}
const itemFolderName = r => r.sku ? `${r.sku} · ${String(r.item).slice(0,48)}` : String(r.item).slice(0,60);
const folderIdFrom = s => (/folders\/([\w-]{10,})/.exec(String(s||"")) || [])[1] || "";
const ITEM_FOLDERS = {};
async function itemFolder(r, create){
  const key = r.sku || r.item; if (ITEM_FOLDERS[key]) return ITEM_FOLDERS[key];
  const id = await itemFolderFind(r, create); if (id) ITEM_FOLDERS[key] = id; return id;
}
async function itemFolderFind(r, create){
  if (r.photos && folderIdFrom(r.photos)) return folderIdFrom(r.photos);
  const box = r.sku ? boxOf(r.sku) : "No box";
  let parent; try{ parent = create ? await boxFolder(box) : (S.boxFolders||{})[box] || (await findFolder(box, await photoRoot().catch(()=>""))||{}).id; }catch{ parent = null; }
  if (parent){ const f = await findFolder(r.sku || itemFolderName(r), parent, !r.sku); if (f) return f.id; }
  if (!create) return null;
  try{ return await makeFolder(itemFolderName(r), parent || await boxFolder(box)); }
  catch(e){ /* the saved folders may have been deleted: find them again once */ return await makeFolder(itemFolderName(r), await boxFolder(box, true)); }
}
async function shrink(file){
  let src; try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch{ src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", .85));
  return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
}
/* keep the folder link in a hidden "Photos" column of the tracker being viewed */
async function linkPhotos(r, folderId){
  const t = activeT(); if (!t) return;
  if (shp(t)){ const col = shp(t).s.ph ?? -1; if (col < 0) return; const sid = await tabId(t.id, sTab(t)); const v = await salesV(t); const i = findRow(v, r, "");
    if (i > sHr(t)) await batch(t.id, [{updateCells:{start:{sheetId:sid,rowIndex:i,columnIndex:col}, rows:[{values:[{userEnteredValue:{stringValue:`https://drive.google.com/drive/folders/${folderId}`}}]}], fields:"userEnteredValue"}}]); return; }
  const h = (await getVals(t.id, "Sales!A1:Z1"))[0] || []; let col = h.findIndex(x => /^\s*photos?\s*$/i.test(String(x||"")));
  const sid = await tabId(t.id, "Sales"); const reqs = [];
  if (col < 0){ col = 12; for (let i=h.length-1;i>=0;i--){ if (String(h[i]??"").trim()){ col = Math.max(12, i+1); break; } }
    reqs.push({updateCells:{start:{sheetId:sid,rowIndex:0,columnIndex:col}, rows:[{values:[{userEnteredValue:{stringValue:"Photos"}}]}], fields:"userEnteredValue"}},
      {updateDimensionProperties:{range:{sheetId:sid, dimension:"COLUMNS", startIndex:col, endIndex:col+1}, properties:{hiddenByUser:true}, fields:"hiddenByUser"}}); }
  const v = await getVals(t.id, "Sales!A1:L997"); const i = findRow(v, r, "");
  if (i > 0) reqs.push({updateCells:{start:{sheetId:sid,rowIndex:i,columnIndex:col}, rows:[{values:[{userEnteredValue:{stringValue:`https://drive.google.com/drive/folders/${folderId}`}}]}], fields:"userEnteredValue"}});
  if (reqs.length) await batch(t.id, reqs);
}
async function savePhotos(r, files, onStep){
  const fid = await itemFolder(r, true); let n = 0;
  const have = await dSearch(`parentId = '${fid}' and mimeType contains 'image/' and trashed = false`).catch(() => []);
  for (const f of files){
    n++; onStep && onStep(n, files.length);
    const b64 = await shrink(f);
    await driveCall("create_file", {title:`${r.sku || "item"} ${String(have.length + n).padStart(2,"0")}.jpg`, contentMimeType:"image/jpeg", base64Content:b64, disableConversionToGoogleType:true, parentId:fid});
  }
  try{ await linkPhotos(r, fid); }catch{}
  delete PHOTO_CACHE["list:"+fid];
  return fid;
}
function b64From(p){
  if (typeof p === "string") return p; if (!p || typeof p !== "object") return "";
  for (const k of ["content","base64Content","data","contents","fileContent","bytes","body"]) if (typeof p[k] === "string") return p[k];
  let best = ""; for (const v of Object.values(p)) if (typeof v === "string" && v.length > best.length) best = v; return best;
}
async function photoUrl(fileId){
  if (PHOTO_CACHE[fileId]) return PHOTO_CACHE[fileId];
  let b = b64From(await driveCall("download_file_content", {fileId})); b = b.replace(/^data:[^,]+,/, "");
  const bin = atob(b), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return PHOTO_CACHE[fileId] = URL.createObjectURL(new Blob([u], {type:"image/jpeg"}));
}
async function drawGallery(r, el){
  if (!el) return;
  el.innerHTML = `<div class="gallery"><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>`;
  try{
    const fid = await itemFolder(r, false);
    if (!fid){ el.innerHTML = `<p class="muted" style="margin:0;font-size:14.5px">No photos saved for this item yet.</p>`; return; }
    const files = PHOTO_CACHE["list:"+fid] || (PHOTO_CACHE["list:"+fid] = (await dSearch(`parentId = '${fid}' and mimeType contains 'image/' and trashed = false`)).sort((a,b) => String(a.title).localeCompare(String(b.title))));
    if (!files.length){ el.innerHTML = `<p class="muted" style="margin:0;font-size:14.5px">No photos saved for this item yet.</p>`; return; }
    el.innerHTML = `<div class="gallery">${files.slice(0,10).map(f => `<button data-id="${esc(f.id)}" aria-label="${esc(f.title)}"><div class="ph" style="width:100%;height:100%"></div></button>`).join("")}</div>
      <a href="https://drive.google.com/drive/folders/${esc(fid)}" target="_blank" rel="noopener" style="font-size:14px;font-weight:700">Open the folder in Google Drive</a>`;
    el.querySelector(".gallery").onclick = e => { const b = e.target.closest("[data-id]"); const img = b && b.querySelector("img"); if (img) openViewer(img.src); };
    for (const f of files.slice(0,10)){
      const b = el.querySelector(`[data-id="${CSS.escape(f.id)}"]`); if (!b) return;
      try{ b.innerHTML = `<img alt="" src="${await photoUrl(f.id)}">`; }catch{ b.innerHTML = `<span class="muted" style="font-size:12px;padding:6px;display:block">Can't show</span>`; }
    }
  }catch(e){ el.innerHTML = `<p class="muted" style="margin:0;font-size:14.5px">${esc(mcpMsg(e, GD))}</p>`; }
}
function openViewer(src){
  const v = document.createElement("div"); v.className = "viewer"; v.innerHTML = `<img alt="Item photo" src="${src}"><button>Close</button>`;
  v.onclick = () => v.remove(); document.body.append(v);
}
function addPhotosTo(r, host){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files].slice(0,12); if (!files.length) return;
    const m = host.querySelector(".phMsg");
    try{ await savePhotos(r, files, (n, of) => { m.innerHTML = `<div class="note info"><span class="spin" aria-hidden="true"></span> Saving photo ${n} of ${of}…</div>`; });
      m.innerHTML = `<div class="note ok">Photos saved in Google Drive › Reseller Desk Photos › ${esc(r.sku ? boxOf(r.sku) : "No box")}.</div>`; SALES = null; drawGallery(r, host.querySelector(".galHost"));
    }catch(e){ m.innerHTML = `<div class="note err">${esc(mcpMsg(e, GD))}</div>`; }
  };
  inp.click();
}

async function inspectTracker(t){

async function addColumn(t, title, hide){

      <button class="item" id="csNo" style="border:1.5px solid var(--line);border-radius:var(--r);padding:14px"><div style="flex:1"><div class="t">No thanks, just the app</div><div class="meta">You can do this later in Settings › Use it in Claude chat.</div></div></button>
    </div>`);
  $("#csNo").onclick = () => { closePanel(); toast("You can set this up later in Settings"); };
  $("#csHave").onclick = () => { closePanel(); toast("You're all set"); };
  $("#csPlug").onclick = () => {
    openPanel(`<h2 style="margin-top:0">Add the Reseller Desk plugin</h2><div class="stack">
      <ol class="steps">
        <li><span>In Claude, go to <b>Customize › Plugins</b>, then <b>Add › Add marketplace</b>.</span></li>
        <li><span>Type <b>SzymonSzmulik/reseller-desk</b>, add it, and turn on <b>Sync automatically</b>.</span></li>
        <li><span>Find <b>Reseller Desk</b> in the list and tap <b>Add</b>.</span></li>
        <li><span>Tip: in a new chat, say <b>"pin reseller desk"</b> and it sits in your Claude sidebar, one tap away.</span></li>
        <li><span>In any chat, try: photos with "List this", a sold screenshot, "tape £3.50" or "drove 12 miles to the carboot".</span></li>
      </ol>
      <a class="btn wide ghost" href="https://szymonszmulik.github.io" target="_blank" rel="noopener">Open the guide</a>
      <button class="btn wide ghost" id="pgProj">I can't find the plugin option</button>
      <button class="btn wide" id="skDone">Done</button></div>`);
    $("#skDone").onclick = closePanel; $("#pgProj").onclick = () => projectPanel();
  };
}
function projectText(){ return skillMd().replace(/^---[\s\S]*?---\s*/, "") + `
## Remembering
Keep a project file called reseller-desk-notes.md. When I say "from now on…", "always…" or "never…", or correct something, follow it straight away and add it to that file. Read it before every task. If it and these instructions disagree, the file wins.

## Help
If I ask "how do I…", do it for me if you can. If only I can do it, give short tap-by-tap steps and explain any technical word.
`; }
function projectPanel(){
  const txt = projectText();

    <ol class="steps">
      <li><span>Tap <b>Copy instructions</b> below.</span></li>

      <li><span>Start chats inside that project. Try sending photos and saying "List this".</span></li>
    </ol>
    <button class="btn wide" id="pjCopy">Copy instructions</button>

    <p class="muted" style="margin:0;font-size:15px">Changed your settings in the app? Copy the instructions again and replace the old ones.</p>

/* ---------- HELP CHAT: Claude, inside the app, for "how do I…" and "something went wrong" ---------- */
let HELP = [], HELP_BUSY = false, TOOLS_OK = null;
function helpGuide(){
  const t = activeT();
  return `You are the help assistant inside "Reseller Desk", a phone app for people who resell second-hand items (mostly on eBay). Many users are not technical. Answer in plain UK English, short and friendly. For how-to questions give numbered tap-by-tap steps naming the exact buttons below. Explain any technical word you use. Never invent buttons or features. If something can only be fixed outside the app, say exactly where to tap. If you can't fix it, say so and suggest they tap "Copy this chat for Claude" and paste it into a normal Claude chat.

HOW THE APP WORKS
- It reads and writes the user's own Google Sheet "tracker" (a copy of the Reseller Tracker template). Sales tab columns: A Item, B Status (Listed/Sold/Returned), C Cost, D Sold Price, E Shipping, F Fees, G Profit (formula), H Date Bought, I Date Sold, J Days to Sell (formula), K SKU, L Bought from, plus an optional "Sold on" column. Expenses tab: Date, Amount, Reason, Category. Optional Carboot_entry tab fills itself in with entry fees (Saturday £2, Sunday £4); to change one day's fee, tap it in Expenses (it is kept in the tab's "Fee change date" and "Fee" columns).
- Photos: when saving a new item, its photos go to Google Drive › Reseller Desk Photos › box › item folder (switch in Settings › Listings). Tapping an item shows its photos and has "+ Add photos". The folder link is kept in a hidden "Photos" column.
- New people see a 3-step setup: connect Google (Claude Settings › Connectors › Google Sheets and Google Drive), make or add a tracker, a few questions.
- eBay drafts (optional): More › Settings › Send drafts to eBay. Needs a free eBay developer account and the free open-source eBay connector installed in the Claude desktop app on a computer ("Copy the setup message" gives a message to paste into Claude there). Then "Send to eBay as a draft" on an item copies a message to paste into Claude on that computer. It doesn't work from the phone yet. If someone wants more (phone drafts or any new feature), explain their options kindly; for new features they can use More › Make your own, and Claude can change the app for them.
- Tracker upgrades: More › Settings › About this app › "Update my spreadsheets" adds missing new pieces (e.g. Sold on, hidden Photos, the Mileage tab). It backs up the sheet first (a copy in Google Drive), only adds columns at the end, never changes typed data, and skips sheets that don't match the template.
- Updates: the app checks for a newer version by itself and shows "Update now" at the top; More › Settings › About this app › Check for updates. If updating fails, they can say "open reseller desk" in a Claude chat (with the plugin added) and Claude puts the newest version in.
- Getting it for a friend: they go to https://szymonszmulik.github.io and follow the steps (Customize › Plugins › Add › Add marketplace › SzymonSzmulik/reseller-desk, turn on Sync automatically, add Reseller Desk, then say "open reseller desk and pin it", which puts the app in their Claude sidebar). Already have the app but it isn't in the sidebar: say "pin reseller desk" in a Claude chat. Works on free and paid Claude plans (free plans have lower usage limits, so lots of listings in one day may hit the limit sooner). The app has no share button.
- Plugin in chat: Settings › Use it in Claude chat explains it. With the plugin, in any chat they can send photos to list, a sold screenshot, an expense ("tape £3.50") or miles ("drove 12 miles to the carboot"), or say "from now on…" to change their settings and sheet. Can't find the plugin option: "Set up a Claude project instead".
- Miles: More › Miles logs business trips into a Mileage tab that works out the HMRC claim (55p a mile for the first 10,000 business miles in the tax year from 6 April 2026, 25p after) and adds it to expenses and HMRC Box 18. Claim miles or real car costs, not both.
- Your spreadsheet: More › Your spreadsheet keeps the sheet's dropdowns in step with their settings, adds columns or tabs, and can mark a tracker as someone else's (hands-off: only new rows, never layout changes).
- Your tabs: More › Your tabs. Every tab they added to their tracker gets the same page, built from its row-1 headings: tabs along the top, a list (newest first), "+ Add to …", tap a row to edit or delete it. Columns with formulas are read-only. On a hands-off tracker they can only add rows. Their own Sales columns show in New item ("Your own columns"), the item details and Edit details.
- Make your own: More › Make your own. They describe a feature in their own words; it reads only their active tracker and shows every change in a before/after table before making it. It can't change formulas, other people's sheets, settings or the app.
- Chat: More › Chat. Tap Reply under a message to reply; the top shows who's online. Anyone with the app can read it, so no personal details.
- Bottom bar: Home, Stock, + New (centre), Sold, More (Expenses, Messages, Chat, Miles, Make your own, Your spreadsheet, Help, Settings, Log a sale). Home: net profit with a monthly chart, this month, stock waiting, sales by month chart, recent sales, items waiting longest, check against the eBay app.
- Older wording of the tabs: Home (year numbers, monthly profit, check against the eBay app), New (photos + details → Claude writes the listing: title, SKU, item specifics, condition, description with Preview/HTML switch and Copy buttons → "Save to tracker"), Stock (Listed/Returned/All, search, tap an item for Mark as sold, Edit details, Copy SKU, Delete; "Select" to delete several), Sold (sold items with profit, totals, by-site table; tap one for thank-you card, message the buyer, return or refund, edit), Messages (ready-made buyer messages with {buyer} {item} {sku} {price} {seller} blanks, Edit/New, plus a line added to every listing and the thank-you card text), Expenses (+ Add an expense, all spending incl. automatic carboot fees, tap to edit/delete).
- Top bar: tracker name button switches between trackers; ? opens this help. More › Settings (groups that fold open, changes save by themselves): add/remove trackers (paste a Google Sheets link, tap "Add tracker"), short names, "Save new items and sales here by default", "Make me a new empty tracker" (copies the blank template into their Google Drive and adds it), username, postage, boxes (start of each SKU, e.g. WOR 1 - 4821), where you buy, where you sell, "Add a Sold on column", "I buy at carboots" switch and carboot days, expense types (one per line), show/hide Sold, Messages, Expenses, listing options, "Save settings", "Use it in Claude chat too" (Make my skill: downloads a skill zip built from their settings; upload in claude.ai Settings → Capabilities → Skills → Upload skill. Or "Set up a Claude project instead": copies project instructions to paste into a new Claude project; Claude then keeps a reseller-desk-notes.md file of their preferences), backup file save/load, home screen shortcut steps, "Give it to a friend".
- Log a sale: from Home "Log a sale" or an item's "Mark as sold". Can read an eBay order screenshot. Asks where it sold if more than one site. "Make the thank-you card too" makes a Google Doc card in Google Drive.
- When several trackers exist, actions show "Save to"/"Change in" chips to pick which trackers get the change.
- Settings save to the user's Claude account, so they appear on every device where they open the app signed in to claude.ai.

COMMON PROBLEMS
- "Google Sheets isn't connected" / nothing loads: on claude.ai go to Settings → Connectors, connect Google Sheets (and Google Drive for cards), then reopen the app and tap Allow when asked.
- App asks for permission: tap Allow; this lets the app use their sheet or Claude.
- "no Sales tab": the link isn't a copy of the Reseller Tracker template. Make a copy of the template and add that link.
- Item "not found, left alone": the row's title or SKU differs between trackers; use Edit details to make them match.
- Dates must be DD/MM/YYYY. Profit and Days to Sell are formulas in the sheet and fill themselves in.
- Deleted something by mistake: in Google Sheets, File → Version history → See version history, pick an earlier version.
- Home screen: copy the app link (Share → Copy link in Claude); iPhone: Shortcuts app → + → Open URLs → paste → Add to Home Screen; Android: open the link in Chrome → ⋮ → Add to Home screen.
- Listing writing or screenshot reading fails: check they're signed in to claude.ai and haven't hit their usage limit; try again later.
- To change how the app itself works: More › Make your own, or ask Claude in a normal chat.

THIS USER RIGHT NOW
- Showing tracker: ${t?tName(t)+" ("+t.name+")":"none added yet"}; trackers: ${S.trackers.map(x=>tName(x)).join(", ")||"none"}
- Boxes: ${S.boxes}; buys from: ${S.sources}; sells on: ${sells().join(", ")}; carboots: ${S.carboot?"on":"off"}; sections hidden: ${Object.entries(S.show).filter(([,v])=>!v).map(([k])=>k).join(", ")||"none"}
- Current tab: ${CUR}
${TOOLS_OK?"- You can look up the user's items with the find_items tool when they ask about a specific item.":""}`;
}
const helpTools = () => TOOLS_OK ? [{
  name:"find_items", description:"Search the user's items in the tracker they're viewing, by words in the title or SKU. Returns up to 15 matches with status, cost, sold price, profit, dates and SKU.",
  inputSchema:{type:"object", properties:{query:{type:"string", description:"Words from the title or SKU; empty for the most recent items"}, status:{type:"string", enum:["Listed","Sold","Returned","any"]}}, required:["query"]},
  execute: async ({query, status}) => { await loadSales(); const q = String(query||"").toLowerCase();
    return (SALES||[]).filter(r => (!status || status==="any" || r.status===status) && (!q || r.item.toLowerCase().includes(q) || r.sku.toLowerCase().includes(q))).slice(-15)
      .map(r => ({item:r.item, status:r.status, sku:r.sku, cost:r.cost, sold:r.sold, profit:r.profit, bought:r.bought, soldOn:r.soldOn, from:r.from, via:r.via})); }
}] : undefined;
function helpPanel(){
  openPanel(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Help</h2><button class="btn small ghost" id="hClose">Close</button></div>
    <p class="muted" style="margin:0 0 12px">Ask how to do something, or say what went wrong.</p>
    <div class="stack" id="hLog" aria-live="polite"></div>
    <div class="chips" id="hSug" style="margin:12px 0" ${HELP.length?"hidden":""}>${["It won't connect to my sheet","How do I add this to my home screen?","How do I add Facebook Marketplace?","How do I track Vinted sales?"].map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="stack" style="margin-top:12px"><textarea id="hIn" placeholder="Type your question" style="min-height:70px"></textarea>
      <button class="btn wide" id="hSend">Ask</button>
      <button class="btn wide ghost" id="hCopy" ${HELP.length?"":"hidden"}>Copy this chat for Claude</button></div>`);
  drawHelp();
  $("#hClose").onclick = closePanel;
  $("#hSug").onclick = e => { const b = e.target.closest("[data-q]"); if (b) askHelp(b.dataset.q); };
  $("#hSend").onclick = () => askHelp($("#hIn").value);
  $("#hCopy").onclick = e => copy(`I'm using the Reseller Desk app and need help.\n\n` + HELP.map(m => `${m.role==="user"?"Me":"App help"}: ${m.content}`).join("\n\n"), e.target);
}
function drawHelp(extra){
  const el = $("#hLog"); if (!el) return;
  el.innerHTML = HELP.map(m => `<div class="${m.role==="user"?"note info":"msg"}" style="${m.role==="user"?"align-self:flex-end;max-width:85%":""}"><div class="mt" style="font-size:16px">${esc(m.content)}</div></div>`).join("") + (extra||"");
}
async function askHelp(q){
  q = String(q||"").trim(); if (!q || HELP_BUSY) return;
  await ready; if (!sample){ toast("Claude isn't available here. Open this app on claude.ai."); return; }
  if (TOOLS_OK===null){ try{ TOOLS_OK = !!(await sample.limits())?.tools; }catch{ TOOLS_OK = false; } }
  HELP.push({role:"user", content:q}); $("#hIn").value = ""; $("#hSug").hidden = true; $("#hCopy").hidden = false;
  HELP_BUSY = true; const btn = $("#hSend"); busy(btn, true, "Thinking…");
  drawHelp(`<div class="msg"><div class="mt" id="hLive"><span class="spin" aria-hidden="true"></span></div></div>`);
  const msgs = HELP.slice(-12).map((m,i,a) => ({role:m.role, content: i===0 ? `${helpGuide()}\n\nTHE USER ASKS:\n${m.content}` : m.content}));
  if (msgs[0].role!=="user") msgs.shift();
  try{
    const opts = {modelTier:"default", cache:false, onText:({text}) => { const l = $("#hLive"); if (l) l.textContent = text; }};
    const tools = helpTools(); if (tools) opts.tools = tools;
    const out = await sample(msgs, opts);
    HELP.push({role:"assistant", content:String(out.text||"").trim() || "Sorry, I couldn't answer that. Try asking another way."});
  }catch(e){ HELP.push({role:"assistant", content: e?.text ? String(e.text) : sampleMsg(e)}); }
  HELP_BUSY = false; drawHelp(); if ($("#hSend")) busy($("#hSend"), false);
  const log = $("#hLog"); log?.lastElementChild?.scrollIntoView({block:"nearest"});
}

/* ---------- redraw charts to fit when the window size changes ---------- */
let RZ_W = innerWidth, RZ_T = 0;
window.addEventListener("resize", () => { clearTimeout(RZ_T); RZ_T = setTimeout(() => {
  if (Math.abs(innerWidth - RZ_W) < 40 || $("#overlay").innerHTML.trim()) return; RZ_W = innerWidth; const y = window.scrollY;
  if (CUR==="home") viewHome().then(() => window.scrollTo(0, y)); else if (CUR==="sold") drawSold(); else if (CUR==="expense") drawExpenses();
}, 250); });

/* ---------- start ---------- */
header();
ready.then(() => { if (!mcp) $("#banner").innerHTML = `<div class="note warn" style="margin-bottom:16px">Open this app on claude.ai while signed in, so it can reach your Google Sheet.</div>`; if ($("#imgNote") && imgOK) $("#imgNote").remove(); });
const startTab = location.hash.slice(1) || "home";
const before = JSON.stringify(S.trackers) + S.active;
if (S.trackers.length) go(startTab);
syncReady.finally(() => {
  header(); drawSync();
  const ju = S.justUpdated; if (ju && ju.to === APP_VERSION){ delete S.justUpdated; save(); setTimeout(() => { if (!whatsNewPanel(ju.from)) checkTrackers(false).catch(() => {}); }, 1200); }
  else setTimeout(() => checkUpdate(false).catch(() => {}).then(() => checkTrackers(false)).catch(() => {}), 2500);
  const changed = JSON.stringify(S.trackers) + S.active !== before;
  if (!S.trackers.length || $("#view").querySelector(".spin.boot")) go(startTab);
  else if (changed && CUR!=="add") { SALES = null; go(CUR); }
  else if (!$("#view").innerHTML.trim() || $("#view").textContent.includes("Loading your settings")) go(startTab);
});
})();
</script>
